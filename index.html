      { label: `Pay for the full vision (${money$(cashE(s, 9000))})`, hint: 'Three remarkable songs. A huge stage show is possible.', fx: () => { s.money -= cashE(s, 9000); const t = [0, 1, 2].map(() => arcSong(s, m, 14, 'Future', pick(['Anthemic', 'Dark', 'Tender']))); moraleAdd(m, 10); schedule(s, 'con3', stepIn(4, 8), { m: m.id, story: c.story, q: t.reduce((a, x) => a + x.q, 0) / 3, full: 1 }); return `Strings, a choir, thunder sheets. Three songs are finished: ${t.map(x => '“' + x.title + '”').join(', ')}.`; } },
      { label: 'Do it on a budget', hint: 'Three good songs. A smaller show.', fx: () => { const t = [0, 1, 2].map(() => arcSong(s, m, 6)); schedule(s, 'con3', stepIn(4, 8), { m: m.id, story: c.story, q: t.reduce((a, x) => a + x.q, 0) / 3, full: 0 }); return `A keyboard plays the strings. It still sounds big. Three songs are finished.`; } },

  },
  con3: {
    w: 0, cond: () => false, ctx: pass,
    title: () => 'The rock opera, live',
    text: (s, c, m) => `${firstOf(m)} wants to premiere the story live, start to finish, with costumes${c.full ? ' and a giant inflatable centrepiece' : ''}.`,
    choices: (s, c, m) => [
      { label: `Stage the full show (${money$(cashE(s, c.full ? 7000 : 3000))})`, hint: 'Triumph or disaster. Nothing in between.', fx: () => { s.money -= cashE(s, c.full ? 7000 : 3000); const sc = showPerf(s, true) + (c.q - 60) / 2 + (c.full ? 8 : 0) + rnd(-15, 15); if (sc >= 62) { s.hype = clamp(s.hype + 20, 0, 100); gainFans(s, 0.07, 600); s.legacyBonus = (s.legacyBonus || 0) + 10; s.pressMood = (s.pressMood || 0) + 3; s.members.forEach(x => moraleAdd(x, 10)); celebrate(s, 'award', 'A rock opera triumph', `The story about ${c.story} brought the house down.`); log(s, 'The rock opera premiere is a triumph.', 'star'); schedule(s, 'con4', stepIn(20, 40), { story: c.story }); return 'Three standing ovations. Somebody in the front row is still crying at the encore.'; } s.hype = clamp(s.hype - 10, 0, 100); s.pressMood = (s.pressMood || 0) - 3; moraleAdd(m, -10); arcEnd(s, 'concept', 'The rock opera premiere flops.'); return 'The inflatable deflates during the big ballad. Reviews use the word “hubris”.'; } },
      { label: 'Just play the songs in a normal set', hint: 'Safe. A small boost.', fx: () => { s.hype = clamp(s.hype + 4, 0, 100); gainFans(s, 0.01, 100); arcEnd(s, 'concept'); return 'The songs go down well. Nobody wears a cape.'; } }
    ]
  },
  con4: {
    w: 0, cond: () => false, ctx: pass,
    title: () => 'A cult classic',
    text: (s, c) => 'Fans are staging their own versions of your rock opera in school halls. A theatre company wants the rights.',

      { label: `Sell the stage rights (${money$(cashE(s, 15000))})`, hint: 'Money, and the story lives on.', fx: () => { s.money += cashE(s, 15000); arcEnd(s, 'concept', 'Your rock opera becomes a stage musical.'); return 'Opening night is in the spring. You get front-row seats.'; } },
      { label: 'Keep it yours', hint: 'Hype from the fans who love it.', fx: () => { s.hype = clamp(s.hype + 10, 0, 100); gainFans(s, 0.03, 300); arcEnd(s, 'concept'); return 'The fans keep it alive themselves. That feels right.'; } }
    ]

  /* ---------- 4. The double life: a member secretly in another band ---------- */

  /* ---------- late fame: only for big acts ---------- */

      { label: 'Debut a brand-new song', hint: 'A gamble in front of everyone.', fx: () => { s.flags.halftime = 1; const p = showPerf(s, true) + rnd(-15, 15); if (p >= 60) { gainFans(s, 0.09, 5000); s.hype = clamp(s.hype + 28, 0, 100); s.legacyBonus = (s.legacyBonus || 0) + 10; celebrate(s, 'tv', 'Halftime legends', 'The new song became the moment of the night.'); log(s, 'The halftime show: a new song, and a legendary night.', 'star'); return 'The new song is the moment of the night. By Monday it is number one everywhere.'; } s.hype = clamp(s.hype + 4, 0, 100); s.pressMood = (s.pressMood || 0) - 3; return 'A hundred million people go to get snacks during the new song. The memes are cruel.'; } },

    valid: (s, c) => s.releases.some(x => x.id === c.r),

      { label: `License “${r.title}” (+${money$(cashE(s, 12000))})`, hint: 'Money and a second life for the song.', fx: () => { s.flags.soundtrack = s.week; s.money += cashE(s, 12000); r.listeners = Math.round(r.listeners * 1.6 + 2000); return 'The film opens big. Your song plays as the credits roll in 4,000 cinemas.'; } },
      { label: 'Write an original for the film', hint: 'A fee and a strong new song.', fx: () => { s.flags.soundtrack = s.week; s.money += cashE(s, 6000); const sg = arcSong(s, bestWriter(s), 10, 'Future', 'Anthemic'); return `“${sg.title}”, written for the film, is ready to record.`; } },
      { label: 'Decline: not that film', hint: 'Integrity.', fx: () => { s.flags.soundtrack = s.week; s.members.forEach(m => moraleAdd(m, 2)); return 'You turn it down. They use someone cheaper.'; } }
    ]; }
  },
  waxwork: {
    w: 0.5, cond: s => tierIdx(s.fans) >= 5 && !s.flags.waxwork,
    ctx: s => ({ m: (s.members.find(m => m.role === 'Vocals') || s.members[0]).id }),
    title: (s, c, m) => `A waxwork of ${firstOf(m)}`,
    text: (s, c, m) => `A famous wax museum has made a figure of ${m.name}. It is unveiled next week. From certain angles it looks like a worried uncle.`,
    choices: (s, c, m) => [
      { label: 'Attend the unveiling', hint: 'Photos everywhere.', fx: () => { s.flags.waxwork = 1; s.hype = clamp(s.hype + 8, 0, 100); moraleAdd(m, 5); return `${firstOf(m)} poses next to the figure. The figure looks more relaxed.`; } },
      { label: 'Demand they fix the nose', hint: `${firstOf(m)} is pleased. The museum isn’t.`, fx: () => { s.flags.waxwork = 1; moraleAdd(m, 8); s.pressMood = (s.pressMood || 0) - 1; return 'A sculptor works through the night. The nose is now perfect, and wrong in a new way.'; } },
      { label: 'Pretend you didn’t notice', hint: 'Nothing happens.', fx: () => { s.flags.waxwork = 1; return 'Tourists take photos with it every day. You never go.'; } }

  brand_face: {
    w: 0.6, cond: s => tierIdx(s.fans) >= 4 && s.week - (s.flags.brandface || -200) > 104,
    ctx: s => ({ brand: pick(['a perfume house', 'a luxury watchmaker', 'a sports car maker', 'a fashion house']), m: s.members.slice().sort((a, b) => b.sk.stage - a.sk.stage)[0].id }),
    title: () => 'A luxury brand wants a face',
    text: (s, c, m) => `${c.brand.charAt(0).toUpperCase() + c.brand.slice(1)} wants ${m.name} for a campaign. Billboards in twenty cities and a very large cheque.`,
    choices: (s, c, m) => [
      { label: `Take the deal (+${money$(cashE(s, 25000))})`, hint: 'Money. The others might be jealous.', fx: () => { s.flags.brandface = s.week; s.money += cashE(s, 25000); moraleAdd(m, 8); s.members.filter(x => x !== m).forEach(x => moraleAdd(x, -5)); s.pressMood = (s.pressMood || 0) - 1; return `${firstOf(m)}’s face is ten metres tall in every airport. The others make jokes. Some of them are jokes.`; } },
      { label: 'Only if the whole band is in it', hint: 'Less money, no jealousy.', fx: () => { s.flags.brandface = s.week; s.money += cashE(s, 12000); s.members.forEach(x => moraleAdd(x, 3)); return 'A group shot in the desert. Everyone looks great. The brand is slightly confused.'; } },
      { label: 'Say no', hint: 'Fans respect it.', fx: () => { s.flags.brandface = s.week; s.pressMood = (s.pressMood || 0) + 2; return '“We sell records, not watches.” It becomes a T-shirt.'; } }
    ]
  },
  celeb_romance: {
    w: 0.6, cond: s => tierIdx(s.fans) >= 4 && s.members.length > 0 && !s.flags.celebrom,
    ctx: s => ({ m: pick(s.members).id, star: pick(['a film star', 'a famous model', 'a talk-show host', 'a tennis champion', 'a pop idol']) }),
    title: () => 'A celebrity romance',
    text: (s, c, m) => `${m.name} is dating ${c.star}. Photographers sleep outside the rehearsal room.`,
    choices: (s, c, m) => [
      { label: 'Lean into it', hint: 'Hype. Chaos.', fx: () => { s.flags.celebrom = 1; s.hype = clamp(s.hype + 14, 0, 100); m.energy = clamp(m.energy - 15, 0, 100); return 'Matching outfits at a premiere. Your single goes back into the charts.'; } },
      { label: 'Protect their privacy', hint: 'Calmer. Less hype.', fx: () => { s.flags.celebrom = 1; moraleAdd(m, 8); return 'No comment, every time. The photographers get bored in a month.'; } },
      { label: 'Ask them to keep it quiet', hint: 'Awkward.', fx: () => { s.flags.celebrom = 1; moraleAdd(m, -8); return `${firstOf(m)} hears “stop having a life”. The van is very quiet.`; } }
    ]
  },
  palace: {
    w: 0.4, cond: s => tierIdx(s.fans) >= 5 && careerYear(s) >= 8 && !s.flags.palace,
    ctx: () => ({}),
    title: () => 'An invitation to the palace',
    text: () => 'You are being given a national honour for services to music. There is a ceremony, a dress code, and a lot of very old people.',
    choices: s => [
      { label: 'Accept in your best suit', hint: 'Legacy. The punks sneer.', fx: () => { s.flags.palace = 1; s.legacyBonus = (s.legacyBonus || 0) + 12; s.pressMood = (s.pressMood || 0) + 2; celebrate(s, 'hof', 'A national honour', 'Services to music.'); log(s, 'You received a national honour for services to music.', 'star'); return 'A medal on a ribbon, a handshake, and a photo your parents frame.'; } },
      { label: 'Turn up in stage clothes', hint: 'Legacy and cred.', fx: () => { s.flags.palace = 1; s.legacyBonus = (s.legacyBonus || 0) + 10; s.hype = clamp(s.hype + 10, 0, 100); log(s, 'You received a national honour, in leather.', 'star'); return 'Leather trousers at the palace. The photo is on every front page.'; } },
      { label: 'Decline, politely', hint: 'Integrity points.', fx: () => { s.flags.palace = 1; s.pressMood = (s.pressMood || 0) + 1; s.members.forEach(m => moraleAdd(m, 3)); return 'A polite letter. The fans love you for it.'; } }
    ]
  },
  fan_convention: {
    w: 0.5, cond: s => tierIdx(s.fans) >= 4 && careerYear(s) >= 5 && !s.flags.fancon,
    ctx: () => ({}),
    title: () => 'A fan convention in your name',
    text: s => `Fans are holding a weekend convention about ${s.name}: tribute bands, a costume contest, a room full of your old setlists.`,
    choices: s => [
      { label: 'Turn up as a surprise', hint: 'Fans for life. Tiring.', fx: () => { s.flags.fancon = 1; gainFans(s, 0.02, 500); s.hype = clamp(s.hype + 10, 0, 100); s.members.forEach(m => { m.energy = clamp(m.energy - 10, 0, 100); moraleAdd(m, 6); }); return 'You walk on stage during the tribute band’s set. Someone faints.'; } },
      { label: 'Send signed gear for the auction', hint: 'Goodwill, no effort.', fx: () => { s.flags.fancon = 1; s.pressMood = (s.pressMood || 0) + 1; return 'A broken drumstick sells for more than your first van.'; } },
      { label: 'Stay away', hint: 'A little weird to watch.', fx: () => { s.flags.fancon = 1; return `You see the photos ${yearOf(s) >= 2000 ? 'online' : 'in a fanzine'}. Some of the costumes are better than your real ones.`; } }
    ]
  }
});
if (typeof EV_CD !== 'undefined') Object.assign(EV_CD, { soundtrack: 40, brand_face: 40 });

/* ---------- solo careers: a star is expensive, fragile and has opinions ---------- */
const artistOf = s => s.members.find(m => m.isArtist) || s.members[0];
const riderCost = s => Math.round(120 * eraF(s) * (1 + tierIdx(s.fans)) / 10) * 10;
Object.assign(EVENTS, {
  solo_rider: {
    w: 1.1, cond: s => s.mode === 'solo' && tierIdx(s.fans) >= 2 && !s.flags.rider && !!artistOf(s),
    ctx: s => ({ m: artistOf(s).id, cost: riderCost(s) }),
    title: () => 'The rider',
    text: (s, c, m) => `${m.name} sends over a new list of demands for every week: a personal stylist, a driver, a chef who understands their diet, and a dressing room painted exactly the right shade of green.`,
    choices: (s, c, m) => [
      { label: `Give them everything (${money$(c.cost)} a week)`, hint: 'Happy star, permanent cost.', fx: () => { s.flags.rider = c.cost; moraleAdd(m, 12); return `${firstOf(m)} is delighted. The green is perfect.`; } },
      { label: `Negotiate it down (${money$(Math.round(c.cost / 2))} a week)`, hint: 'A bit happier, half the cost.', fx: () => { s.flags.rider = Math.round(c.cost / 2); moraleAdd(m, 3); return 'A driver and a chef. The stylist and the paint are off the table.'; } },
      { label: 'Say no', hint: `${firstOf(m)} won’t forget it.`, fx: () => { s.flags.rider = -1; moraleAdd(m, -14); if (typeof remember === 'function') remember(s, m, 'grudge', 'The rider you refused'); return `${firstOf(m)} reads your reply twice and doesn’t speak to you for a week.`; } }
    ]
  },
  solo_burnout: {
    w: 1.4, cond: s => s.mode === 'solo' && !!artistOf(s) && !artistOf(s).away && artistOf(s).energy < 48 && s.stats.gigs > 15 && s.week - (s.flags.burnout || -100) > 40,
    ctx: s => ({ m: artistOf(s).id }),
    title: (s, c, m) => `${firstOf(m)} is running on empty`,
    text: (s, c, m) => `${m.name} hasn’t slept properly in weeks. Without a band to share the load, every interview, show and photo shoot lands on one person.`,
    choices: (s, c, m) => [

function wrapFig(o2, defs, body, x, g, k) {

function portraitSVG(m, year, genre) {

function stageSVG() {
  const y = yearOf(S); const E = ERA_LOOK[eraOf(y)];
  const W = 360, H = 210, G = 150;
  const glow = 0.12 + S.hype / 260;
  let beams = '', figs = '';
  const ms = S.mode === 'solo' ? S.members.slice() : S.members.filter(m => !m.away);
  const order = { Drums: 0, Keys: 1, Bass: 2, Guitar: 3, Vocals: 4 };
  const init = S.name.replace(/^The /i, '').charAt(0);
  if (S.mode === 'solo') {
    const back = ['Keys', 'Drums', 'Bass'].slice(0, S.pol.session);
    back.forEach((r, i) => { figs += personSVG(70 + i * 110, G - 14, 0.7, { look: { skin: SKINS[(i * 2 + 1) % 6], hair: HAIRC[i + 1], seed: 31 * i + 5, top: i + 1 }, morale: 65, energy: 80, age: 30 }, y, { role: r, dim: true, initial: init, noStand: true }); });
    beams += `<polygon points="160,0 200,0 235,170 125,170" fill="url(#beam)" opacity="${n1(glow * 2)}"/>`;
    if (ms[0]) figs += personSVG(180, G, 1.2, ms[0], y, { role: 'Vocals', label: esc(ms[0].name.split(' ')[0]) });
  } else {
    ms.sort((a, b) => order[a.role] - order[b.role]);
    const n = ms.length; const gap = W / (n + 1);
    ms.forEach((m, i) => {
      const x = gap * (i + 1); const back = m.role === 'Drums' || m.role === 'Keys';
      beams += `<polygon points="${n1(x - 14)},0 ${n1(x + 14)},0 ${n1(x + 40)},170 ${n1(x - 40)},170" fill="url(#beam)" opacity="${n1(glow)}"/>`;
      const k = n > 4 ? 0.95 : 1.15;
      const fn = m.name.split(' ')[0], maxc = Math.max(4, Math.floor(gap / 6.6));
      figs += personSVG(x, back ? G - 8 : G, back ? k * 0.92 : k, m, y, { label: esc(fn.length > maxc ? fn.slice(0, maxc - 1) + '…' : fn), dim: m.energy < 25, initial: init });
    });
  }
  // amps behind the string players, sized by the Amps & PA level
  let amps = '';
  const ampLvl = S.up.equip || 0;
  if (S.mode === 'band' && ampLvl >= 1) ms.forEach((m, i) => { if (m.role !== 'Guitar' && m.role !== 'Bass') return; const x = W / (ms.length + 1) * (i + 1) + (i % 2 ? -26 : 26); const h = 16 + ampLvl * 9; amps += `<rect x="${n1(x - 11)}" y="${n1(G - h)}" width="22" height="${h}" rx="2" fill="#1a171d" stroke="#4a4256" stroke-width="1.2"/><rect x="${n1(x - 9)}" y="${n1(G - h + 3)}" width="18" height="5" fill="#3a3540"/>${ampLvl >= 2 ? `<circle cx="${n1(x)}" cy="${n1(G - h / 2 + 2)}" r="6" fill="#0d0b10"/>` : ''}${ampLvl >= 3 ? `<circle cx="${n1(x)}" cy="${n1(G - h + 18)}" r="5" fill="#0d0b10"/>` : ''}`; });
  // lights rig
  const L2 = S.up.lights || 0; let rig = '';
  if (L2 >= 1) for (let i = 0; i < 6; i++) { const x = 30 + i * 60; rig += `<rect x="${x - 5}" y="${L2 >= 2 ? 10 : 18}" width="10" height="9" rx="2" fill="#2a2730" stroke="#555" stroke-width="1"/><circle cx="${x}" cy="${L2 >= 2 ? 20 : 28}" r="3" fill="${['#ffb53d', '#ff5d82', '#5fd6ff'][i % 3]}"/>`; }
  if (L2 >= 2) rig = `<rect x="10" y="6" width="${W - 20}" height="5" fill="#3d3a44" stroke="#5a5566" stroke-width="1"/>` + rig;
  if (L2 >= 3) for (let i = 0; i < 5; i++) rig += `<line x1="${60 + i * 60}" y1="12" x2="${30 + i * 75}" y2="${G}" stroke="${['#ff3fa4', '#36d7ff', '#b8f06a'][i % 3]}" stroke-width="1.2" opacity=".55"/>`;
  const crowdN = S.lastGig ? Math.max(4, Math.min(16, Math.round(2 + Math.log10(1 + S.lastGig.crowd) * 3.5))) : 5;
  const L = typeof ui !== 'undefined' && ui.live; const beat = (60 / (Sound.bpm(S.genre) || 120)).toFixed(3);
  const vid = stageVenue(), vfill = vid ? stageFill(vid) : 0;
  return `<svg class="stage${L ? ' live live-' + L.kind + (L.perf != null && L.perf < 45 ? ' shaky' : '') : ''}" style="--beat:${beat}s" viewBox="0 0 ${W} ${H}" role="img" aria-label="Your ${S.mode === 'band' ? 'band' : 'artist'} on stage in ${y}">
    <defs><linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb53d" stop-opacity=".9"/><stop offset="1" stop-color="#ffb53d" stop-opacity="0"/></linearGradient><linearGradient id="scrg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#36d7ff"/><stop offset="1" stop-color="#ff3fa4"/></linearGradient></defs>
    <rect width="${W}" height="${H}" fill="#0f0c14"/>${backdropSVG(E.deco, W, H, S)}${vid ? `<g class="venue v-${vid}">${venueBackSVG(vid, W, G)}</g>` : ''}<g class="beams">${beams}</g>${rig}${amps}
    <rect y="${G + 2}" width="${W}" height="${H - G - 2}" fill="#241c2c"/><line x1="0" y1="${G + 2}" x2="${W}" y2="${G + 2}" stroke="#57496a"/>
    ${figs}
    ${vid ? venueFrontSVG(vid, W, H, G, S.hype) : ''}
    <g class="crowdg">${vid ? crowdRows(W, vid, vfill, y >= 2007) : crowdSVG(W, 196, L && L.kind === 'gig' ? Math.max(crowdN, Math.min(16, Math.round(3 + Math.log10(1 + (L.crowd || 50)) * 3.5))) : crowdN, y >= 2007)}</g>
    <text x="${W - 8}" y="16" text-anchor="end" class="st-year">${y}</text>
  </svg>`;
}

/* ================= SAVES: career slots, checkpoints, hardcore ================= */
const IDX = 'backstage-index-v2', SLOT = 'backstage-slot-', CPK = 'backstage-cp-';
const MAX_SLOTS = 5, MAX_AUTO = 2, MAX_MANUAL = 3;
let storeWarned = false;
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { } }
function idxLoad() { try { const x = JSON.parse(lsGet(IDX) || 'null'); if (x && Array.isArray(x.slots)) return x; } catch (e) { } return { active: null, slots: [] }; }
function idxSave(x) { return lsSet(IDX, JSON.stringify(x)); }
function slotMeta(s) {
  return { id: s.slotId, name: s.mgr ? s.mgr.name : 'You', act: s.name, mode: s.mode, genre: s.genre, start: s.startYear, when: `${s.startYear + Math.floor((s.week - 1) / 52)} · Week ${((s.week - 1) % 52) + 1}`, week: s.week, fans: Math.round(s.fans), money: Math.round(s.money), hard: !!s.hard, over: !!s.over, t: Date.now() };
}
function newSlotId() { return 's' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36); }

/* compression for checkpoints (browser-native, falls back to plain JSON) */
async function packStr(txt) {
  try {
    if (typeof CompressionStream === 'undefined') throw 0;
    const buf = await new Response(new Blob([txt]).stream().pipeThrough(new CompressionStream('deflate'))).arrayBuffer();
    let bin = ''; const u = new Uint8Array(buf); for (let i = 0; i < u.length; i += 0x8000) bin += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
    return 'z:' + btoa(bin);
  } catch (e) { return 'j:' + txt; }
}
async function unpackStr(p) {
  if (p.startsWith('j:')) return p.slice(2);
  const bin = atob(p.slice(2)); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate'))).text();
}

/* main save/load */
function save() {
  if (!S) return;
  if (!isFinite(S.money) || !isFinite(S.fans) || !isFinite(S.hype) || !isFinite(S.week)) { try { console.error('Backstage: not saving a state with broken numbers'); } catch (e) { } const ok = loadSlot(S.slotId); if (ok) { S = ok; toast('Something went wrong this week, so the game went back to your last save.'); } return; }
  const idx = idxLoad();
  if (!S.slotId) S.slotId = newSlotId();
  const txt = JSON.stringify(S);
  let ok = lsSet(SLOT + S.slotId, txt);
  if (!ok) { pruneCheckpoints(S.slotId); ok = lsSet(SLOT + S.slotId, txt); }
  if (!ok) { if (!storeWarned) { storeWarned = true; toast('Progress not saved: storage is full. Delete an old career or checkpoint, or copy your save code.'); } if (typeof ui !== 'undefined') ui.saveFail = true; return; }
  if (typeof ui !== 'undefined' && ui.saveFail) { ui.saveFail = false; storeWarned = false; }
  const meta = slotMeta(S), i = idx.slots.findIndex(x => x.id === S.slotId);
  if (i >= 0) idx.slots[i] = meta; else idx.slots.unshift(meta);
  idx.active = S.slotId; idxSave(idx);
  // yearly automatic checkpoint at the start of each new year
  if (!S.hard && !S.over && S.week > 1 && (S.week - 1) % 52 === 0) {
    const cps = cpList(S.slotId);
    if (!cps.some(c => c.week === S.week)) addCheckpoint('auto', `Start of ${S.startYear + Math.floor((S.week - 1) / 52)}`);
  }
}
function load() {
  const idx = idxLoad();
  // one-time move of the old single save into a slot
  const old = lsGet('backstage-save-v1');
  if (old) {
    try { const s = JSON.parse(old); if (s && s.members) { s.slotId = newSlotId(); lsSet(SLOT + s.slotId, JSON.stringify(s)); const m = migrate(s); idx.slots.unshift(slotMeta(m)); idx.active = s.slotId; idxSave(idx); } } catch (e) { }
    lsDel('backstage-save-v1');
  }
  if (!idx.active) return null;
  return loadSlot(idx.active);
}
function loadSlot(id) {
  try { const t = lsGet(SLOT + id); if (t) { const s = JSON.parse(t); if (s && s.members) { s.slotId = id; return migrate(s); } } } catch (e) { }
  return null;
}
function goMenu() { if (S) save(); const idx = idxLoad(); idx.active = null; idxSave(idx); S = null; ui.modal = null; ui.tab = 'week'; ui.confirm = null; }
function continueSlot(id) {
  const s = loadSlot(id); if (!s) { toast('That save could not be read.'); return; }
  S = s; const idx = idxLoad(); idx.active = id; idxSave(idx); ui.tab = 'week'; ui.modal = null; ui.plan.action = 'gig'; ui.plan.venue = 'pub'; ui.plan.price = refPrice(S, VENUES[0]);
}
function deleteSlot(id) {
  lsDel(SLOT + id); lsDel(CPK + id);
  const idx = idxLoad(); idx.slots = idx.slots.filter(x => x.id !== id); if (idx.active === id) idx.active = null; idxSave(idx);
  if (S && S.slotId === id) S = null;
}
function slotsFull() { return idxLoad().slots.length >= MAX_SLOTS; }

/* checkpoints */
function cpList(id) { try { return JSON.parse(lsGet(CPK + id) || '[]'); } catch (e) { return []; } }
function cpSave(id, list) {
  let ok = lsSet(CPK + id, JSON.stringify(list));
  while (!ok && list.some(c => c.kind === 'auto')) { const i = list.map(c => c.kind).lastIndexOf('auto'); list.splice(i, 1); ok = lsSet(CPK + id, JSON.stringify(list)); }
  return ok;
}
function pruneCheckpoints(keepId) {
  idxLoad().slots.forEach(sl => { if (sl.id === keepId) return; const l = cpList(sl.id).filter(c => c.kind !== 'auto'); lsSet(CPK + sl.id, JSON.stringify(l)); });
}
async function addCheckpoint(kind, label) {
  if (!S || S.hard) return false;
  const id = S.slotId, snap = JSON.stringify(S), meta = { id: uid(), kind, label, week: S.week, when: weekLabel(S.week), fans: Math.round(S.fans), money: Math.round(S.money), t: Date.now() };
  meta.data = await packStr(snap);
  let list = cpList(id).filter(c => !(c.kind === kind && c.week === meta.week));
  list.unshift(meta);
  const autos = list.filter(c => c.kind === 'auto'), mans = list.filter(c => c.kind === 'manual');
  list = list.filter(c => c.kind === 'auto' ? autos.indexOf(c) < MAX_AUTO : mans.indexOf(c) < MAX_MANUAL);
  const ok = cpSave(id, list);
  if (!ok) toast('Not enough storage for a checkpoint. Delete an old career first.');
  if (S && S.slotId === id && ui.tab === 'biz') render();
  return ok;
}
async function loadCheckpoint(cid) {
  if (!S) return;
  const c = cpList(S.slotId).find(x => x.id === cid); if (!c) return;
  try {
    const s = JSON.parse(await unpackStr(c.data)); s.slotId = S.slotId; S = migrate(s);
    S.report = null; ui.modal = null; ui.live = null; ui.tab = 'week'; ui.plan.tracks = []; save();
    toast(`Loaded: ${c.label}`); render(); window.scrollTo(0, 0);
  } catch (e) { toast('That checkpoint could not be read.'); }
}
function deleteCheckpoint(cid) { if (!S) return; cpSave(S.slotId, cpList(S.slotId).filter(c => c.id !== cid)); }

/* ---------- UI pieces ---------- */
function ago(t) { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' days ago'; }
function careersHTML() {
  const sl = idxLoad().slots; if (!sl.length) return '';
  return `<section class="block"><h3>Your careers <span class="mini">${sl.length}/${MAX_SLOTS}</span></h3><div class="slots">${sl.map(x => `<div class="slot ${x.over ? 'done' : ''}">
    <div><b>${esc(x.act)}</b><span class="note">${esc(x.genre)} · ${x.mode === 'solo' ? 'solo' : 'band'} · ${esc(x.when)}${x.hard ? ' · <em class="tag hard">Hardcore</em>' : ''}${x.over ? ' · career over' : ''}</span><span class="mini">${num(x.fans)} fans · ${money$(x.money)} · saved ${ago(x.t)}</span></div>

}
function savesHTML() {

  const row = c => `<div class="slot"><div><b>${esc(c.label)}</b><span class="mini">${c.kind === 'auto' ? 'Automatic' : 'Your save'} · ${num(c.fans)} fans · ${money$(c.money)} · ${ago(c.t)}</span></div>
    <div class="chips"><button class="chip" data-a="cpload" data-v="${c.id}">${ui.confirm === 'cpload' + c.id ? 'Tap again: progress since is lost' : 'Load'}</button>${c.kind === 'manual' ? `<button class="chip danger" data-a="cpdel" data-v="${c.id}">Delete</button>` : ''}</div></div>`;
  return `<section class="block"><h3>Saves</h3>
    <p class="note">The game saves itself every week.${S.hard ? '' : ` You can also keep up to ${MAX_MANUAL} saves of your own, and the game keeps one from the start of each of the last ${MAX_AUTO} years.`}</p>
    ${S.hard ? `<p class="note"><em class="tag hard">Hardcore</em> One save, no going back. Bank limit −$1,000, more trouble, no tips, rough forecasts. Legacy +25%.</p>` : `
    <div class="chips"><button class="chip on" data-a="cpsave">${man.length >= MAX_MANUAL ? `Save now (replaces the oldest of your ${MAX_MANUAL})` : 'Save now'}</button></div>
    ${cps.length ? `<div class="slots">${cps.map(row).join('')}</div>` : '<p class="mini">No saves yet.</p>'}`}
    <div class="chips"><button class="chip wide" data-a="menu">Main menu · switch career</button></div>
    ${S.hard ? '<p class="mini">Hardcore careers can’t be copied or moved. No going back.</p>' : `<p class="mini">${window.APP ? 'Saves live on this phone. To move a career to another device, copy the save code and paste it there (for example through Notes or a message).' : 'Saves live in this browser. To move a career to another device, save it as a file, or copy the save code.'}</p>
    <div class="chips">${window.APP ? '' : '<button class="chip" data-a="savefile">Save as a file</button>'}<button class="chip" data-a="showcode">${ui.code ? 'Hide save code' : 'Show save code'}</button></div>
    ${ui.code ? (saveCode() ? `<textarea id="savecode" class="txt code" readonly rows="4">${esc(saveCode())}</textarea><p class="mini">${num(saveCode().length)} characters.</p><button class="chip" data-a="copycode">Copy</button>` : '<p class="mini">Packing the save…</p>') : ''}`}
  </section>`;

function restoreHTML() {
  return `<section class="block"><h3>Restore a career</h3><p class="note">Paste a save code to bring a career back as a new slot.</p><textarea id="restorecode" class="txt code" rows="3" placeholder="Paste a save code"></textarea>${ui.restoreErr ? `<p class="warn" role="alert">${esc(ui.restoreErr)}</p>` : ''}<div class="chips"><button class="chip" data-a="restore" ${slotsFull() ? 'disabled' : ''}>${slotsFull() ? `All ${MAX_SLOTS} slots are in use` : 'Restore from code'}</button><label class="chip filebtn">Open a save file<input id="restorefile" type="file" accept=".json,.txt,application/json,text/plain" ${slotsFull() ? 'disabled' : ''}></label></div></section>`;
}

/* ================= MONTH PLANNER: plan four weeks, play them, pause when it matters ================= */
const MONTH_PRESETS = {
  grind: { name: 'Local grind', acts: ['gig', 'rehearse', 'gig', 'rest'] },
  writing: { name: 'Writing month', acts: ['write', 'write', 'rehearse', 'gig'] },
  studio: { name: 'Studio month', acts: ['write', 'record', 'gig', 'rest'] },
  balanced: { name: 'Balanced', acts: ['rehearse', 'gig', 'write', 'rest'] },
  recover: { name: 'Rest and recover', acts: ['rest', 'rehearse', 'rest', 'write'] }
};
const PLAN_ACTS = ['gig', 'rehearse', 'write', 'record', 'rest'];
// ticket price per planned gig: cheap fills the room (more fans and hype), premium earns more per ticket
const PRICE_TIERS = { cheap: { name: 'Cheap', m: 0.75 }, normal: { name: 'Normal', m: 1 }, premium: { name: 'Premium', m: 1.25 } };
const tierPrice = (v, t) => Math.max(1, Math.round(refPrice(S, v) * (PRICE_TIERS[t] || PRICE_TIERS.normal).m));
// unlocks at week 6 once the guide is done or skipped, and at week 10 regardless
const monthUnlocked = () => !!S && ((S.week >= 6 && !(S.tut && S.tut.on)) || S.week >= 10);
function monthTeaser() {
  if (!S || monthUnlocked()) return '';
  const left = S.tut && S.tut.on ? Math.max(1, 10 - S.week) : Math.max(1, 6 - S.week);
  const why = S.tut && S.tut.on && S.week >= 6 ? `after the guide, or in ${left} week${left > 1 ? 's' : ''}` : `in ${left} week${left > 1 ? 's' : ''}`;
  return `<div class="chips pmode"><span class="chip on" aria-current="true">This week</span><button class="chip locked" disabled aria-label="Plan a month, locked, unlocks ${why}"><svg class="lockic" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Plan a month · unlocks ${why}</button></div>`;
}
function defaultVenue() { const open = VENUES.filter(v => venueOpen(S, v)); const pv = VENUES.find(v => v.id === ui.plan.venue); return (pv && venueOpen(S, pv) ? pv : open[open.length - 1] || VENUES[0]).id; }
const liveClosed = () => !!(S && shockOn(S) && S.shock.mods && S.shock.mods.nolive);
function newMonthPlan(preset) {
  const acts = (MONTH_PRESETS[preset] || MONTH_PRESETS.balanced).acts;
  S.plan4 = { done: 0, start: S.week, preset, weeks: acts.map(a => ({ action: a === 'gig' && liveClosed() ? 'write' : a, venue: defaultVenue(), at: S.week })) };
}
function ensurePlan() {
  const P = S.plan4;
  // a plan left over from earlier weeks (played week by week since) starts fresh
  if (!P || P.done >= 4 || (!P.acc && S.week !== P.start + P.done)) newMonthPlan(P ? P.preset : 'balanced');
  return S.plan4;
}

function slotPlan(P, i) {
  const w = P.weeks[i], prev = P.weeks[i - 1];
  const v = VENUES.find(x => x.id === w.venue) || VENUES[0];
  return { ...ui.plan, action: w.action, venue: v.id, price: tierPrice(v, w.tier), promo: w.action === 'gig' && S.week > (w.at || 0), fresh: w.action === 'record' && !!prev && prev.action === 'write' && i - 1 < P.done };
}
const avgEnergy = () => { const a = S.members.filter(m => !m.away); return a.length ? a.reduce((x, m) => x + m.energy, 0) / a.length : 0; };
const unhappyNow = () => S.members.filter(m => !m.isArtist && (isUnderpaid(S, m) || m.morale < 35));

function runMonth(maxWeeks) {
  const P = ensurePlan(); if (ui.live || S.event) return;
  if (maxWeeks === 1) delete P.acc;
  // a month interrupted by an event carries on where it left off: one report at the end
  const sum = P.acc && P.acc.weeks ? P.acc : { weeks: [], evs: [], m0: S.money, f0: S.fans, h0: S.hype, start: S.week };
  delete P.acc; sum.evs = sum.evs || []; delete sum.paused;
  const n0 = S.members.length, sad0 = new Set(unhappyNow().map(m => m.id));
  let stop = 'done', count = 0, last = null;
  while (P.done < 4 && count < maxWeeks && !S.over) {
    const i = P.done, sp = slotPlan(P, i); let swap = '';
    if (sp.action === 'gig' && liveClosed()) { sp.action = 'write'; P.weeks[i].action = 'write'; swap = `Venues are closed, so ${S.mode === 'solo' ? 'you' : 'the band'} wrote songs instead.`; }
    else if (sp.action === 'gig') { const v = VENUES.find(x => x.id === sp.venue); if (!v || !venueOpen(S, v)) { const nv = VENUES.find(x => x.id === defaultVenue()) || VENUES[0]; swap = `${v ? v.name : 'That venue'} won’t book you any more, so the gig moved to ${nv.name}.`; sp.venue = nv.id; sp.price = tierPrice(nv, P.weeks[i].tier); P.weeks[i].venue = nv.id; } }
    const r = playWeek(S, sp);
    if (!r) { stop = 'event'; break; }
    if (r.err) { stop = 'err'; sum.err = r.err; break; }
    if (S.tut) S.tut[sp.action] = true;
    last = r; P.done++; count++;
    const ks = splitLines(r.lines).key;
    if (r.led) { sum.led = sum.led || {}; for (const k in r.led) sum.led[k] = (sum.led[k] || 0) + r.led[k]; }
    sum.weeks.push({ week: r.week, action: sp.action, head: (swap ? swap + ' ' : '') + r.head, perf: r.perf, dm: r.dMoney, df: r.dFans, keys: ks, promo: sp.promo && sp.action === 'gig' });
    if (S.over) { stop = 'over'; break; }
    if (S.event) { stop = 'event'; break; }
    if (S.members.length !== n0) { stop = 'member'; break; }
    if (r.recap) { stop = 'year'; break; }
    const sad = unhappyNow().find(m => !sad0.has(m.id));
    if (sad && P.done < 4) { stop = 'unhappy'; sum.who = sad.name; sum.pay = isUnderpaid(S, sad); break; }
    if (S.money < bankLimit(S) / 2 && P.done < 4) { stop = 'money'; break; }
    if (avgEnergy() < 25 && P.done < 4 && P.weeks[P.done].action !== 'rest') { stop = 'tired'; break; }
  }
  if (!last) { if (sum.err) toast(sum.err); else if (stop === 'event') { ui.modal = null; } save(); render(); return; }
  if (maxWeeks === 1 && stop !== 'err') { ui.modal = 'report'; ui.evDone = null; if (P.done >= 4) newMonthPlan(P.preset); save(); render(); window.scrollTo(0, 0); return; }
  if (stop === 'event' && P.done >= 4) stop = 'done';
  if (stop === 'event' && P.done < 4 && maxWeeks > 1) { sum.paused = true; P.acc = sum; }
  sum.stop = stop; sum.dm = Math.round(S.money - sum.m0); sum.df = Math.round(S.fans - sum.f0); sum.dh = Math.round(S.hype - sum.h0); sum.left = 4 - P.done;
  S.report.month = sum;
  if (P.done >= 4) newMonthPlan(P.preset);
  ui.modal = 'report'; ui.evDone = null; save(); render(); window.scrollTo(0, 0);
}

/* ---------- live moment: the band plays before the report opens ---------- */
let liveTimer = 0;
function simTour() {
  if (!S.tour || ui.live || S.event) return;
  const f0 = S.fans, m0 = S.money, n0 = S.members.length; let weeks = 0, shows = 0, stop = 'done';
  while (S.tour && !S.over && weeks < 30) {
    const r = playWeek(S, { ...ui.plan, action: 'tour' });
    if (!r || r.err) { if (r && r.err) toast(r.err); stop = 'err'; break; }
    weeks++; if (r.perf != null) shows += 3;
    if (S.event) { stop = 'event'; break; }
    if (S.members.length !== n0) { stop = 'member'; break; }
    if (r.recap) { stop = 'year'; break; }
    const a = S.members.filter(m => !m.away), en = a.length ? a.reduce((x, m) => x + m.energy, 0) / a.length : 0;
    if (S.tour && en < 25 && !tourRestDue(S)) { stop = 'tired'; break; }
  }
  if (S.report) S.report.sim = { weeks, shows, dm: Math.round(S.money - m0), df: Math.round(S.fans - f0), stop };
  ui.modal = 'report'; save(); render();
}
function startLive(kind, r) {

  if (!ms) return false;
  const where = kind === 'gig' ? (r.tourLine ? r.head : (r.venue ? VENUES.find(v => v.id === r.venue).name : r.head)) : '';
  ui.live = { kind, perf: r.perf, crowd: r.crowd, where, title: kind === 'record' ? (S.releases[0] && S.releases[0].title) : '', until: Date.now() + ms };
  clearTimeout(liveTimer); liveTimer = setTimeout(endLive, ms);

}
function endLive() {

}
