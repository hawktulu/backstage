<style>
/* Layout: one narrow column like a tour laminate, gig-poster header, fixed bottom tab bar. Deliberately single dark theme: it is a stage. */
:root {
  --bg: #15111b; --panel: #1f1927; --panel2: #29212f; --line: #3a3046; --line2: #57496a;
  --fg: #f3ebde; --muted: #a99eb6; --amber: #ffb53d; --pink: #ff5d82; --violet: #a493ff; --teal: #4fd1c5; --sky: #6cb6ff;
  --good: #6fd49d; --bad: #ff6f6f; --stage: #0f0c14; --floor: #241c2c;
  --display: 'Big Shoulders Display', Impact, 'Futura-CondensedExtraBold', 'Avenir Next Condensed', 'Arial Narrow', sans-serif;
  --body: 'Work Sans', system-ui, -apple-system, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent;
  background: radial-gradient(120% 60% at 50% -10%, #2b1f33 0%, var(--bg) 60%) fixed, var(--bg); }
#app { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: max(12px, env(safe-area-inset-top, 0px)) calc(88px + env(safe-area-inset-bottom, 0px)); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
button:disabled { opacity: .4; cursor: not-allowed; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
.mono, .val, .wk, .sv, .proj b, .ledger b { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--amber); }
.lab, .mini { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.mini { margin: 12px 0 6px; }
.note { color: var(--muted); font-size: 13.5px; margin-top: 8px; }
.warn { margin-top: 10px; padding: 9px 11px; border-left: 3px solid var(--pink); background: color-mix(in srgb, var(--pink) 10%, transparent); font-size: 13.5px; }
.pos { color: var(--good); } .neg { color: var(--bad); }

/* header */
.top { padding: 8px 0 14px; border-bottom: 1px dashed var(--line2); }
.marquee { font-family: var(--display); font-weight: 900; text-transform: uppercase; font-size: clamp(38px, 11vw, 58px); line-height: .9; letter-spacing: .005em; margin-top: 6px; overflow-wrap: anywhere; }
.sub { color: var(--muted); margin-top: 6px; font-size: 13.5px; }
.stats { display: grid; grid-template-columns: 1.2fr 1fr 1.2fr; gap: 12px; margin-top: 14px; }
.stats > div { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.val { font-size: 19px; font-weight: 500; }
.bar { display: block; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; background: var(--amber); border-radius: 3px; transition: width .4s; }
.bar.hype i { background: linear-gradient(90deg, var(--amber), var(--pink)); }
.bar.good i { background: var(--good); } .bar.bad i { background: var(--bad); }

/* blocks */
.pane { display: flex; flex-direction: column; gap: 22px; margin-top: 16px; }
.block h3 { font-family: var(--display); font-weight: 800; text-transform: uppercase; font-size: 22px; letter-spacing: .02em; margin-bottom: 10px; }
.stage { width: 100%; height: auto; display: block; border: 1px solid var(--line); border-radius: 4px; }
.st-name { font-family: var(--mono); font-size: 10px; fill: var(--muted); }

.acts { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
.act, .chip, .opt, .venue, .choice, .mbtn { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; text-align: left; }
.act { padding: 10px 10px; font-weight: 600; font-size: 14px; }
.act.on, .chip.on, .opt.on, .venue.on { border-color: var(--amber); background: color-mix(in srgb, var(--amber) 14%, var(--panel)); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 7px 11px; font-size: 13.5px; }
.chip.sq { width: 34px; text-align: center; padding: 6px 0; font-weight: 600; }
.chip.wide { width: 100%; margin-top: 10px; text-align: center; }
.chip.danger { border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); color: var(--bad); }
.go { width: 100%; margin-top: 14px; padding: 14px; background: var(--amber); color: #1a1208; border: 0; border-radius: 4px; font-family: var(--display); font-weight: 800; font-size: 21px; text-transform: uppercase; letter-spacing: .03em; }
.go:active { transform: translateY(1px); }

.venues { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 12px; }
.venue { padding: 9px 10px; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.vk { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--amber); }
.vn { font-weight: 600; font-size: 14px; }
.vm { font-size: 12px; color: var(--muted); font-family: var(--mono); }
.slider { display: flex; justify-content: space-between; margin-top: 14px; font-weight: 600; }
.slider b { font-family: var(--mono); color: var(--amber); }
input[type=range] { width: 100%; accent-color: var(--amber); margin-top: 6px; }
.proj, .ledger { margin-top: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
.row span { color: var(--muted); }
.row em { font-style: normal; color: var(--muted); font-size: 12px; margin-left: 4px; }
.row.tot { border-top: 1px dashed var(--line2); padding-top: 6px; }

.ready { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.ready > div { display: flex; flex-direction: column; min-width: 0; }
.ready b { font-family: var(--display); font-size: 30px; font-weight: 800; line-height: 1; margin-top: 4px; }

.diary { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.diary li { display: grid; grid-template-columns: 38px 1fr; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.diary .wk { color: var(--muted); font-size: 12px; }
.diary .star span:last-child { color: var(--amber); }
.diary .bad span:last-child { color: var(--bad); }
.diary .story span:last-child { color: var(--fg); }
.diary li span:last-child { color: var(--muted); min-width: 0; }
.shockrow { border-color: var(--amber) !important; } .season .rivl.shockrow .mini.wk { flex-basis: auto; }
button.rivl.decrow { width: 100%; font: inherit; color: inherit; text-align: left; cursor: pointer; }
.decch { margin: 14px 0 18px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; }
.decch .goals { margin-top: 6px; }
.lact { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 10px 0; }
.lact-h { display: flex; flex-direction: column; gap: 2px; }
.lact-n { display: flex; gap: 14px; margin: 8px 0 4px; font-size: 13.5px; } .lact-n em { display: block; font-style: normal; font-size: 11px; color: var(--muted); }
.lact.scout { display: flex; justify-content: space-between; align-items: center; gap: 10px; } .lact.scout .chip { flex: none; }
.stage .pyro { transform-box: fill-box; transform-origin: 50% 100%; animation: pyro 0.5s ease-in-out infinite alternate; }
@keyframes pyro { from { transform: scaleY(.85); opacity: .85; } to { transform: scaleY(1.1); opacity: 1; } }
.stage .neonsign { filter: drop-shadow(0 0 3px #ff5d82); }
@media (prefers-reduced-motion: reduce) { .stage .pyro { animation: none; } }
.repcover { margin: 10px 0 4px; } .repcover svg, .repcover .cover { width: 132px !important; height: 132px !important; max-width: 132px; border-radius: 4px; box-shadow: 0 8px 22px rgba(0,0,0,.45); transform: rotate(-2deg); }
.savefail { position: sticky; top: 0; z-index: 30; background: #a3111a !important; color: #fff !important; padding: 10px 16px; font-size: 14px; font-weight: 600; }
.sheet:focus, .cele:focus, .pending:focus { outline: none; }
.cashwhy { font-size: 13.5px; color: var(--muted); margin: 8px 0 4px; line-height: 1.5; } .cashwhy b { color: var(--ink, inherit); font-weight: 600; } .cashwhy .neg { color: var(--bad); } .cashwhy .pos { color: var(--good, #5fd38d); }
.proj .row.tot.wk { border-top: 1px dashed var(--line); } .recsum { margin-top: 14px; } .recsum .eyebrow { margin-bottom: 4px; } .runcost { margin-top: 8px; }
.recsum .rs-songs { font-weight: 500; font-size: 13px; text-transform: none; letter-spacing: 0; text-align: right; }
.mgrface { display: inline-block; flex: none; line-height: 0; } .mgrface svg { width: 100%; height: 100%; border-radius: 10px; }
.mgrface.big { width: 64px; height: 64px; } .mgrface.sm { width: 30px; height: 30px; margin-right: 10px; vertical-align: middle; }
.mgrrow { display: flex !important; flex-direction: row !important; align-items: center; gap: 12px; } .mgrrow > div { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
.mgrrow .chip.small { min-height: 32px; padding: 4px 12px; font-size: 13px; margin-top: 4px; }
.inboxh { display: inline-flex; align-items: center; }
.dgroups { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.dgroups details > summary { list-style: none; cursor: pointer; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; min-height: 44px; padding: 10px 12px; border-radius: 10px; background: var(--card, rgba(255,255,255,.04)); border: 1px solid var(--line); }
.dgroups details > summary::-webkit-details-marker { display: none; }
.dgroups details > summary b::before { content: '▸'; display: inline-block; width: 1.1em; color: var(--muted); transition: transform .15s; }
.dgroups details[open] > summary b::before { transform: rotate(90deg); }
.dgroups .ddec > summary { font-size: 16px; }
.dgroups .ddec > .dyear, .dgroups .dyear > .dmon { margin: 8px 0 0 10px; }
.dgroups .dyear > .diary, .dgroups .dmon > .diary, .dgroups .dyear > p { margin: 6px 0 0 14px; }
.dgroups .diary li { grid-template-columns: 46px 1fr; }

/* members */
.member { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 12px; margin-top: 10px; display: flex; flex-direction: column; gap: 10px; }
.mh { display: flex; align-items: center; gap: 10px; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.mt { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.mt b { font-size: 16px; }
.mt > span { font-size: 13px; color: var(--muted); }
.mbtn { padding: 6px 12px; font-size: 13px; }
.sks { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.sk { background: var(--panel2); border-radius: 3px; padding: 6px 4px; display: flex; flex-direction: column; align-items: center; position: relative; }
.sl { font-size: 10px; letter-spacing: .08em; color: var(--muted); font-family: var(--mono); }
.sv { font-size: 20px; font-weight: 500; line-height: 1.1; }
.sk i { position: absolute; top: 3px; right: 4px; font-style: normal; font-size: 9px; }
.sk i.up { color: var(--good); } .sk i.dn { color: var(--bad); }
.sk.pot { background: transparent; border: 1px dashed var(--line2); }
.sk.pot .sv { color: var(--muted); }
.k1 { color: var(--bad); } .k2 { color: var(--muted); } .k3 { color: var(--fg); } .k4 { color: var(--amber); } .k5 { color: var(--good); }
.mb { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { font-size: 11.5px; padding: 3px 7px; border-radius: 3px; background: var(--panel2); color: var(--muted); }
.manage { border-top: 1px dashed var(--line2); padding-top: 4px; display: flex; flex-direction: column; gap: 6px; }
.agent .chip.wide { margin-top: 0; }
.pol { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.opt { padding: 10px; display: flex; flex-direction: column; gap: 2px; }
.opt b { font-size: 14px; } .opt span { font-size: 12px; color: var(--muted); }

/* merch */
.designer { display: grid; grid-template-columns: 150px 1fr; gap: 14px; align-items: start; }
.dctl { min-width: 0; }
.dctl .mini:first-child { margin-top: 0; }
.merch-svg { width: 100%; height: auto; display: block; border-radius: 4px; border: 1px solid var(--line); }
.merch-svg.sm { width: 72px; flex: none; }
.sw { display: flex; flex-wrap: wrap; gap: 6px; }
.swatch { width: 38px; height: 30px; padding: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; display: flex; gap: 2px; }
.swatch i { flex: 1; border-radius: 2px; }
.swatch.on { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber); }
.txt { width: 100%; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; color: var(--fg); font: inherit; }
.vibe { margin-top: 12px; font-weight: 600; }
.vibe.good { color: var(--good); } .vibe.bad { color: var(--bad); }
.inv { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.ib { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.ib > span { font-size: 12.5px; color: var(--muted); }
.pr { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 4px; }

/* studio */
.songs { list-style: none; margin: 10px 0 0; padding: 0; }
.songs li { display: grid; grid-template-columns: 1fr 34px; align-items: center; column-gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.songs .bar { grid-column: 1 / -1; height: 3px; }
.songs em { font-style: normal; font-size: 11px; color: var(--pink); margin-left: 4px; }
.sq-v { font-family: var(--mono); text-align: right; }
.rel { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 12px; margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }
.rel > div:first-child { display: flex; flex-direction: column; }
.rel span { font-size: 12.5px; color: var(--muted); }
.rn { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rn span { font-family: var(--mono); color: var(--fg); font-size: 14px; display: flex; flex-direction: column; }
.rn em { font-family: var(--body); font-style: normal; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.upg { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.upg > div { display: flex; flex-direction: column; min-width: 0; }
.upg .note { margin-top: 2px; }
.ms { list-style: none; padding: 0; margin: 12px 0 0; display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; }
.ms li { display: flex; flex-direction: column; color: var(--amber); }
.ms .wk { font-size: 11px; color: var(--muted); }

/* nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(5, 1fr); background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.nav button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; color: var(--muted); font-size: 11px; }
.nav svg { width: 22px; height: 22px; }
.nav button.on { color: var(--amber); }

/* modal */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(8, 5, 12, .72); display: flex; align-items: flex-end; justify-content: center; padding: 0 max(0px, env(safe-area-inset-right, 0px)) 0 max(0px, env(safe-area-inset-left, 0px)); }
.sheet { width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; background: var(--panel); border-top: 3px solid var(--amber); border-radius: 10px 10px 0 0; padding: 20px max(18px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)); animation: up .28s ease-out; }
@keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
.sheet h2 { font-family: var(--display); font-weight: 900; text-transform: uppercase; font-size: 32px; line-height: .95; margin-top: 6px; }
.lede { margin-top: 10px; font-size: 15.5px; }
.lede.big { font-size: 18px; margin-top: 12px; }
.perf { margin-top: 14px; }
.perf b { font-family: var(--display); font-size: 40px; font-weight: 900; display: block; line-height: 1; }
.deltas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.deltas span { font-family: var(--mono); font-size: 17px; background: var(--panel2); border-radius: 4px; padding: 8px; display: flex; flex-direction: column; }
.deltas em { font-family: var(--body); font-style: normal; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.lines { margin: 14px 0 0; padding-left: 18px; color: var(--muted); font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.choices { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
.choice { padding: 12px; display: flex; flex-direction: column; gap: 2px; }
.choice b { font-size: 15px; } .choice span { font-size: 13px; color: var(--muted); }
.choice:hover { border-color: var(--amber); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 4px; font-size: 14px; max-width: calc(100% - 32px); }

/* setup */
.setup { display: flex; flex-direction: column; gap: 22px; padding-top: 24px; }
.logo { font-family: var(--display); font-weight: 900; text-transform: uppercase; font-size: clamp(64px, 20vw, 110px); line-height: .82; letter-spacing: -.01em; color: var(--amber); }
.setup .lede { color: var(--muted); max-width: 40ch; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.setup .opt b { font-family: var(--display); font-size: 22px; text-transform: uppercase; font-weight: 800; }
.setup .opt span { font-size: 13px; }

/* eras, lyrics, cartoon */
.eras { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.era { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; text-align: left; padding: 10px; display: flex; flex-direction: column; gap: 2px; }
.era b { font-family: var(--display); font-weight: 900; font-size: 28px; line-height: 1; }
.era span { font-size: 12px; color: var(--muted); }
.era.on { border-color: var(--amber); background: color-mix(in srgb, var(--amber) 14%, var(--panel)); }
.era.on b { color: var(--amber); }
.pw { font-style: normal; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; margin-left: 4px; color: var(--muted); }
.chip.on .pw { color: inherit !important; opacity: .85; font-weight: 700; }
/* money never splits from its sign; long single words wrap instead of being cut off */
.val, .ledger .row b, .evfx span { white-space: nowrap; }
.celein h2, .mname, .member h3, .card h3 { overflow-wrap: anywhere; }
.celein h2 { max-width: 100%; }
.stage .fig { filter: drop-shadow(0 0 1.6px rgba(255, 214, 170, .55)); }
.st-year { font-family: var(--display); font-weight: 900; font-size: 22px; fill: #ffb53d; opacity: .9; }
.portrait { width: 56px; height: 56px; flex: none; }
.lyr { font-size: 12px; color: var(--muted); font-style: italic; }
.scene { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
.scene > div { display: flex; flex-direction: column; font-size: 13.5px; min-width: 0; }
.scene .mine span { color: var(--amber); font-weight: 600; }
.songb { all: unset; display: grid; grid-template-columns: 1fr 34px; align-items: center; column-gap: 8px; cursor: pointer; width: 100%; }
.songb:focus-visible { outline: 2px solid var(--amber); }
.songs li { display: block; }
.songs .st { display: flex; flex-direction: column; }
.songs small { font-size: 11.5px; color: var(--muted); }
.lyrics { margin: 10px 0 4px; padding: 10px 12px; border-left: 3px solid var(--pink); background: var(--panel2); font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-size: 14.5px; line-height: 1.55; border-radius: 0 4px 4px 0; }
.lyrics b { font-family: var(--display); font-style: normal; text-transform: uppercase; font-size: 16px; letter-spacing: .03em; color: var(--pink); }
.news { margin-top: 14px; padding: 12px; background: var(--panel2); border-radius: 4px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }

/* music tab */
.subtabs { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px; gap: 3px; }
.subtabs button { background: none; border: 0; border-radius: 4px; padding: 9px 0; font-family: var(--display); font-weight: 800; font-size: 18px; text-transform: uppercase; color: var(--muted); }
.subtabs button.on { background: var(--amber); color: #1a1208; }
.songb { grid-template-columns: 1fr auto !important; }
.nums { display: flex; gap: 10px; }
.nums span, .sstats span, .rn2 span { display: flex; flex-direction: column; align-items: flex-end; font-family: var(--mono); font-size: 16px; }
.nums em, .sstats em, .rn2 em { font-family: var(--body); font-style: normal; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sdetail { padding: 8px 0 4px; display: flex; flex-direction: column; gap: 8px; }
.sstats { display: flex; gap: 18px; }
.sstats span { align-items: flex-start; }
.rec { border-bottom: 1px solid var(--line); padding: 10px 0; }
.recb { all: unset; display: flex; gap: 12px; align-items: center; cursor: pointer; width: 100%; }
.recb:focus-visible { outline: 2px solid var(--amber); }
.cover { width: 84px; height: 84px; flex: none; border-radius: 3px; box-shadow: 0 2px 0 rgba(0,0,0,.35); }
.ri { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.ri > span { font-size: 12.5px; color: var(--muted); }
.rn2 { display: flex; gap: 14px; margin-top: 2px; }
.rn2 span { align-items: flex-start; font-size: 13.5px; color: var(--fg); }
.tracks, .edit, .setprev, .setres, .picks { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; }
.tracks li, .edit li, .setprev li { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.tracks li { grid-template-columns: 22px 1fr; }
.tracks small, .edit small, .picks small { display: block; font-size: 11.5px; color: var(--muted); }
.tracks .mono, .edit .mono, .setprev .mono { color: var(--muted); font-size: 12px; }
.edit .st, .setprev .st, .picks .st { min-width: 0; }
.edit li.cut { opacity: .5; }
.ctl { display: flex; gap: 4px; }
.setprev .bar { width: 70px; margin: 0; }
.setprev em { font-style: normal; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--amber); margin-left: 4px; }
.setbox { margin-top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.setbox .mini { margin: 0; }
.setrow { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.setrow b { color: var(--amber); font-size: 14px; }
.setres li { display: grid; grid-template-columns: 1fr 90px; align-items: center; gap: 10px; padding: 4px 0; font-size: 14px; }
.setres .bar { margin: 0; }
.setres li.hot span { color: var(--good); } .setres li.cold span { color: var(--muted); }
.pickb { all: unset; display: grid; grid-template-columns: 24px 1fr auto; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); cursor: pointer; width: 100%; font-size: 14px; }
.pickb:focus-visible { outline: 2px solid var(--amber); }
.tick { width: 20px; height: 20px; border: 1px solid var(--line2); border-radius: 4px; display: grid; place-items: center; color: #1a1208; font-size: 13px; }
.pickb.on .tick { background: var(--amber); border-color: var(--amber); }

/* talent, vices, manager */
.ta { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: flex-end; }
.ta span { min-width: 0; }
@media (max-width: 420px) { .stamp { top: 10px; right: 10px; font-size: 15px; padding: 5px 8px; } .sheet:has(.stamp) > p.eyebrow:first-of-type, .sheet:has(.stamp) > h2:first-of-type { padding-right: 92px; } }
.ta span { display: flex; flex-direction: column; gap: 2px; }
.ta em { font-style: normal; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.stars { color: var(--amber); letter-spacing: 2px; font-size: 15px; }
.stars i { font-style: normal; color: var(--line2); }
.stars small { color: var(--muted); font-size: 11px; letter-spacing: 0; margin-left: 4px; }
.tag.badt { background: color-mix(in srgb, var(--bad) 22%, transparent); color: var(--bad); }
.tag.warnt { background: color-mix(in srgb, var(--amber) 18%, transparent); color: var(--amber); }
.tag.goodt { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.ready { grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)) !important; }
.mgr { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.mgrh { display: flex; flex-direction: column; }
.mgrh b { font-family: var(--display); font-weight: 900; font-size: 26px; text-transform: uppercase; line-height: 1; }
.mgrh span { color: var(--muted); font-size: 13.5px; }
.ready b.sm { font-size: 18px; font-weight: 500; padding-top: 8px; }

/* world */
.why { font-size: 12px; color: var(--muted); margin-top: 4px; }
.linkb { all: unset; cursor: pointer; font-size: 12px; color: var(--amber); text-decoration: underline; margin-top: 6px; }
.linkb:focus-visible { outline: 2px solid var(--amber); }
.parts { list-style: none; margin: 10px 0 0; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; }
.parts li { display: flex; justify-content: space-between; gap: 10px; }
.parts li span { color: var(--muted); }
.pd { margin-top: 12px; } .pd summary { cursor: pointer; color: var(--amber); font-size: 13.5px; }
.revs { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.rev { display: grid; grid-template-columns: 52px 1fr; gap: 10px; align-items: start; background: var(--panel2); border-radius: 4px; padding: 8px 10px; font-size: 13.5px; }
.rev b { font-size: 16px; color: var(--amber); }
.rev em { display: block; font-style: normal; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.subtabs.four { grid-template-columns: repeat(4, 1fr); }
.subtabs.four button { font-size: 16px; }
.mag { border-bottom: 1px solid var(--line); padding: 12px 0; }
.magh { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
.magh b { font-family: var(--display); font-weight: 800; font-size: 20px; text-transform: uppercase; }
.magh span { grid-column: 1; font-size: 12px; color: var(--muted); }
.magh em { grid-column: 2; grid-row: 1 / span 2; align-self: center; font-style: normal; font-family: var(--mono); font-size: 13px; color: var(--muted); }
.magh em.pos { color: var(--good); }
.magl, .chart, .rivals, .goals, .tres { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; }
.magl li { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; font-size: 13.5px; }
.magl small, .chart small, .rivals small, .goals small { display: block; font-size: 11.5px; color: var(--muted); }
.magl li small { display: inline; }
.magl .mono { color: var(--muted); width: 18px; }
.magl li.you, .chart li.you, .rivals li.you { color: var(--amber); }
.chart li, .rivals li, .goals li { display: grid; grid-template-columns: 26px auto 1fr auto; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.rivals li, .goals li { grid-template-columns: 26px 1fr auto; }
.chart li.you, .rivals li.you { background: color-mix(in srgb, var(--amber) 8%, transparent); }
.chart i, .rivals i { font-style: normal; font-size: 10px; }
.chart i.up, .rivals i.up { color: var(--good); } .chart i.dn, .rivals i.dn { color: var(--bad); }
.chart i.nw { color: var(--amber); font-size: 9px; font-family: var(--mono); }
.pos2 { color: var(--muted); font-size: 13px; }
.ct { min-width: 0; }
.rivals em { font-style: normal; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--amber); }
.goals li.done .ct { color: var(--good); }
.goals .tick { width: 20px; height: 20px; border: 1px solid var(--line2); border-radius: 4px; display: grid; place-items: center; font-size: 12px; color: #1a1208; }
.goals li.done .tick { background: var(--good); border-color: var(--good); }
.sub3 { margin-top: 18px !important; }
.tourcard { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.tourcard b { font-family: var(--display); font-weight: 800; font-size: 20px; text-transform: uppercase; }
.tourcard > span { font-size: 13px; color: var(--muted); }
.tres li { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-top: 1px solid var(--line); font-size: 13px; }
.tres li span { color: var(--muted); min-width: 0; }
.code { font-family: var(--mono); font-size: 11px; resize: vertical; margin: 8px 0; word-break: break-all; }
.legacy { margin-top: 12px; display: flex; align-items: baseline; gap: 12px; }
.legacy b { font-family: var(--display); font-size: 48px; font-weight: 900; color: var(--amber); line-height: 1; }
.legacy span:last-child { font-weight: 600; }
.nav { grid-template-columns: repeat(6, 1fr) !important; }

/* week v2 */
.stagewrap { position: relative; }
.sndbtn { position: absolute; left: 8px; top: 8px; width: 34px; height: 34px; border-radius: 50%; background: rgba(15,12,20,.75); border: 1px solid var(--line2); color: var(--fg); display: grid; place-items: center; padding: 0; }
.sndbtn svg { width: 18px; height: 18px; }
.sndbtn.off { width: auto; border-radius: 17px; padding: 0 12px 0 8px; display: flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 600; color: #1a1208; background: var(--amber); border-color: var(--amber); animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(255, 181, 61, .25); } }
.stage.live .fig { animation: bob var(--beat) ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
.stage.live .fig:nth-of-type(2n) { animation-delay: calc(var(--beat) / -2); }
.stage.live.shaky .fig { animation-duration: calc(var(--beat) * 2.3); }
.stage.live-gig .crowdg { animation: jump var(--beat) ease-in-out infinite alternate; }
.stage.live-gig .beams { animation: flash calc(var(--beat) * 2) steps(2) infinite; }
.stage.live-rehearse .beams, .stage.live-record .beams, .stage.live-write .beams { opacity: .35; }
.stage.live-write .fig { animation: sway calc(var(--beat) * 4) ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-3px) rotate(-1.5deg); } }
@keyframes sway { 0%, 100% { transform: rotate(-1deg); } 50% { transform: rotate(1deg); } }
@keyframes jump { from { transform: translateY(0); } to { transform: translateY(-6px); } }
@keyframes flash { 0% { opacity: 1.6; filter: hue-rotate(0deg); } 100% { opacity: .5; filter: hue-rotate(60deg); } }
.livecap { position: absolute; left: 50%; transform: translateX(-50%); bottom: 10px; display: flex; gap: 8px; align-items: center; background: rgba(15,12,20,.85); border: 1px solid var(--amber); border-radius: 18px; padding: 4px 6px 4px 12px; font-size: 12.5px; font-weight: 600; white-space: nowrap; max-width: calc(100% - 20px); }
.livecap span { overflow: hidden; text-overflow: ellipsis; }
.livecap .chip { padding: 4px 10px; font-size: 12px; }
.recdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ff3b30; margin-right: 6px; animation: pulse 1s infinite; }
@media (prefers-reduced-motion: reduce) { .stage.live .fig, .stage.live .crowdg, .stage.live .beams { animation: none !important; } }
@media (prefers-reduced-motion: reduce) { .sndbtn.off { animation: none; } }
.sndbtn[aria-pressed="true"] { color: var(--amber); border-color: var(--amber); }
.strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 12px; }
.stt { display: flex; flex-direction: column; min-width: 0; }
.stt b { font-family: var(--display); font-size: 26px; font-weight: 800; line-height: 1; margin-top: 2px; }
.stt b.good { color: var(--good); } .stt b.bad { color: var(--bad); }
.tips { display: flex; flex-direction: column; gap: 6px; }
.tip { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 10px 9px 12px; background: color-mix(in srgb, var(--amber) 9%, var(--panel)); border: 1px solid color-mix(in srgb, var(--amber) 30%, var(--line)); border-radius: 6px; font-size: 13.5px; }
.tip p { min-width: 0; }
.tip .chip { flex: none; white-space: nowrap; }
.tip.warnb { background: color-mix(in srgb, var(--pink) 10%, var(--panel)); border-color: color-mix(in srgb, var(--pink) 35%, var(--line)); }
.acts2 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px; }
.acts2 button { background: none; border: 0; border-radius: 5px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 6px; color: var(--muted); font-size: 11.5px; font-weight: 600; }
.acts2 svg { width: 22px; height: 22px; }
.acts2 button.on { background: var(--amber); color: #1a1208; }
.panel { margin-top: 4px; }
.venues.hs { display: flex; overflow-x: auto; gap: 6px; scroll-snap-type: x mandatory; padding-bottom: 4px; }
.venues.hs .venue { flex: 0 0 132px; scroll-snap-align: start; }
.more { margin-top: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; }
.more summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--amber); }
.more .setbox { border: 0; padding: 0; background: none; }
.go.sticky { position: sticky; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); z-index: 5; box-shadow: 0 6px 18px rgba(0,0,0,.45); }
.subtabs.five { grid-template-columns: repeat(5, 1fr); }
.subtabs.five button { font-size: 14px; }
.thumb { width: 34px; height: 34px; flex: none; border-radius: 2px; }
.chart li { grid-template-columns: 22px 22px 34px 1fr auto !important; }
.recap { margin-top: 14px; padding: 12px; border: 1px solid var(--amber); border-radius: 6px; background: color-mix(in srgb, var(--amber) 7%, var(--panel2)); }
.recap .deltas { margin-top: 8px; }
.magcover { width: 160px; height: auto; display: block; margin: 12px auto 0; border-radius: 3px; box-shadow: 0 8px 24px rgba(0,0,0,.5); transform: rotate(-2deg); }
.choice:disabled { opacity: .45; }

/* merch layout & logo */
#mprev svg { touch-action: none; cursor: grab; }
.designer { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) !important; gap: 16px !important; }
.dprev { position: sticky; top: 8px; display: flex; flex-direction: column; gap: 0; min-width: 0; }
@media (max-width: 520px) { .designer { grid-template-columns: 1fr !important; } .dprev { position: static; } #mprev { max-width: 280px; margin: 0 auto; width: 100%; } }
.layout { margin-top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.layout .mini { margin: 0 0 4px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--panel2); border-radius: 5px; padding: 3px; gap: 3px; margin-bottom: 6px; }
.seg button { background: none; border: 0; border-radius: 4px; padding: 7px 0; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--amber); color: #1a1208; }
.lsl { display: flex; justify-content: space-between; font-size: 13px; margin-top: 4px; }
.lsl b { font-family: var(--mono); color: var(--amber); font-weight: 500; }
.layout input[type=range] { width: 100%; accent-color: var(--amber); }
.layout .chips { margin-top: 6px; }
.logoed { display: grid; grid-template-columns: minmax(0, 220px) 1fr; gap: 14px; align-items: start; }
#logopad { width: 100%; aspect-ratio: 1; max-width: 100%; border-radius: 6px; border: 1px solid var(--line2); touch-action: none; cursor: crosshair; display: block; }
@media (max-width: 460px) { .logoed { grid-template-columns: 1fr; } #logopad { max-width: 260px; } }

.clip { margin-top: 14px; background: #f2ede2; color: #1d1b22; border-radius: 3px; padding: 12px 14px; box-shadow: 0 4px 14px rgba(0,0,0,.4); transform: rotate(-.6deg); }
.clip .eyebrow { color: #a3222a; }
.clip h4 { margin: 4px 0 6px; font-family: Georgia, 'Times New Roman', serif; font-size: 20px; line-height: 1.15; text-wrap: balance; }
.clip p { font-family: Georgia, 'Times New Roman', serif; font-size: 14px; line-height: 1.45; color: #3a3540; }
.clip.neg h4 { color: #6e1420; }
.fxs { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.fxs span { font-family: var(--body); font-size: 11.5px; font-weight: 600; padding: 2px 7px; border-radius: 10px; background: #dfe9d8; color: #1f5a2e; }
.fxs span.neg { background: #f3d6d6; color: #8a1c1c; }
.clips { display: flex; flex-direction: column; gap: 4px; }
.clip.sm { margin-top: 8px; padding: 9px 12px; transform: none; }
.clip.sm h4 { font-size: 16px; margin-bottom: 2px; }

.slots { display: grid; gap: 8px; margin: 8px 0 10px; }
.slot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel2); }
.slot > div:first-child { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.slot.done { opacity: .7; }
.slot .chips { margin: 0; }
.tag.hard { color: var(--bad); font-style: normal; }
.newh { font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-family: var(--display); margin: 22px 0 6px; }
.deltas.four { grid-template-columns: repeat(4, 1fr); }
.keyl { margin-top: 12px; font-size: 14px; color: var(--muted); } .keyl b { color: var(--fg); }
.keys { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14.5px; }
.keys li { padding-left: 14px; position: relative; } .keys li::before { content: ''; position: absolute; left: 0; top: .55em; width: 6px; height: 6px; border-radius: 50%; background: var(--line2); }
.keys li.star { color: var(--amber); font-weight: 600; } .keys li.star::before { background: var(--amber); }
.ik li { display: flex; gap: 9px; align-items: flex-start; padding-left: 0; } .ik li::before { display: none; }
.ik .kic { flex: none; width: 17px; height: 17px; margin-top: 1px; fill: none; stroke: var(--muted); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.ik .k-star .kic { stroke: var(--amber); } .ik .k-warn .kic { stroke: var(--bad); } .ik .k-money .kic { stroke: var(--good, #5fd38d); } .ik .k-fans .kic { stroke: var(--accent, #6cb6ff); } .ik .k-energy .kic, .ik .k-mood .kic { stroke: #b49cff; }
ul.lines.ik { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.sheet > .go[data-a="closereport"], .sheet > .go[data-a="closeresult"] { position: sticky; bottom: 0; z-index: 2; box-shadow: 0 -12px 18px var(--panel); }
.pd.more { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
.evbox { margin-top: 18px; padding: 14px; border: 1px solid var(--amber); border-radius: 12px; background: rgba(255,181,61,.06); }
.evbox h3 { font-family: var(--display); font-weight: 800; font-size: 22px; text-transform: uppercase; margin: 4px 0 6px; }
.evbox.done { border-color: var(--line2); background: var(--panel2); }
.evbox + .go, .evbox.done + .go { margin-top: 14px; }
.coach { border: 1px solid var(--amber); border-radius: 12px; padding: 14px; margin: 12px 0; background: rgba(255,181,61,.07); }
.coach .steps { display: flex; gap: 4px; margin: 8px 0; } .coach .steps i { flex: 1; height: 4px; border-radius: 2px; background: var(--line2); } .coach .steps i.on { background: var(--amber); }
.coach h3 { font-family: var(--display); font-weight: 800; font-size: 21px; text-transform: uppercase; }
.coach p { font-size: 14px; color: var(--muted); margin-top: 4px; }
.coach .chips { margin-top: 10px; }
.mem { font-size: 12.5px; margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
.mem span { padding: 2px 8px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); }
.mem span.g { color: var(--bad); border-color: rgba(255,111,111,.35); } .mem span.f { color: var(--good); border-color: rgba(111,212,157,.35); }
.locknote { font-size: 13px; color: var(--muted); padding: 10px 12px; border: 1px dashed var(--line2); border-radius: 10px; margin-top: 10px; }
.confirmbox { width: 100%; margin-top: 10px; padding: 12px; border: 1px solid var(--amber); border-radius: 10px; background: rgba(255,181,61,.07); font-size: 14px; }
.confirmbox .chips { margin-top: 8px; }
.unk { font-family: var(--mono); color: var(--muted); font-size: 15px; }
.bandrow { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 13.5px; color: var(--muted); }
.bandrow b { color: var(--fg); font-family: var(--mono); font-weight: 500; } .bandrow em { font-style: normal; font-family: var(--mono); }

/* ================= VERSION 2: the interface travels through the decades ================= */
:root {
  --body: 'Atkinson Hyperlegible', system-ui, -apple-system, sans-serif;
  --mono: 'Atkinson Hyperlegible', system-ui, sans-serif;

}
/* Default: concert colours (stage gels, softened for night play). Dusty rose and steel cyan on velvet midnight. */
body[data-era="stage"] { --bg: #0e1230; --panel: #1a2050; --panel2: #232a63; --line: #313a7a; --line2: #4a55a3; --fg: #efe6d6; --muted: #a2a8cf; --amber: #d9709c; --pink: #e08aad; --violet: #5db4d2; --teal: #5db4d2; --sky: #5db4d2; --good: #6fd3a4; --bad: #ec6a7a; --on-accent: #1f0a17; --paper: #f1e8d8; --paper-ink: #1a2050; --display: 'Big Shoulders Display', Impact, 'Futura-CondensedExtraBold', 'Avenir Next Condensed', sans-serif; --dweight: 800; --tape: rgba(217, 112, 156, .35); --stage: #090b1e; --floor: #161a3d; color-scheme: dark; }
body[data-era="stage"][data-v="2"] { background: radial-gradient(120% 60% at 50% -10%, #1f1a4a 0%, var(--bg) 60%) fixed, var(--bg); }
body[data-era="stage"] .marquee { letter-spacing: .01em; }
/* 1970s: glam and disco. Aubergine, glossy teal, glitter pink. */
body[data-era="1970"] { --bg: #24112e; --panel: #331a40; --panel2: #422252; --line: #57306b; --line2: #7a4a92; --fg: #fbeede; --muted: #cbaed2; --amber: #ff5da2; --pink: #ff5da2; --violet: #18b3a6; --teal: #18b3a6; --good: #4fd8a6; --bad: #ff6b6b; --on-accent: #2a0718; --paper: #fbeede; --paper-ink: #2a0f30; --display: 'Shrikhand', Georgia, serif; --dweight: 400; --tape: rgba(24, 179, 166, .38); color-scheme: dark; }
/* 1980s: neon. Midnight purple, hot pink, cyan. */
body[data-era="1980"] { --bg: #130b26; --panel: #1e1340; --panel2: #2a1b55; --line: #3c2a73; --line2: #5d47a6; --fg: #f4ecff; --muted: #ad9fdb; --amber: #ff3fa4; --pink: #ff3fa4; --violet: #2de2e6; --teal: #2de2e6; --good: #45f0b0; --bad: #ff6382; --on-accent: #1b0426; --paper: #f2eeff; --paper-ink: #1e1340; --display: 'Audiowide', 'Arial Black', sans-serif; --dweight: 400; --tape: rgba(45, 226, 230, .35); color-scheme: dark; }
/* 1990s: photocopied zine. Xerox paper, ink, flannel red. */
body[data-era="1990"] { --bg: #e6e2d7; --panel: #f4f1e9; --panel2: #dcd6c8; --line: #bab2a1; --line2: #8d8571; --fg: #1a1916; --muted: #48433a; --amber: #c4161c; --pink: #c4161c; --violet: #3d6b45; --teal: #3d6b45; --good: #2c7a3a; --bad: #b3121a; --on-accent: #fff7ec; --paper: #fbfaf5; --paper-ink: #1a1916; --display: 'Special Elite', 'Courier New', monospace; --dweight: 400; --tape: rgba(120, 110, 90, .25); --stage: #1d1b1f; --floor: #2b282e; color-scheme: light; }
/* 2000s: Sharpie on band posters. Black, hot pink, violet. */
body[data-era="2000"] { --bg: #0f0d13; --panel: #1b1722; --panel2: #262030; --line: #372d43; --line2: #524465; --fg: #f6f1f8; --muted: #a99bb5; --amber: #ff4fb8; --pink: #ff4fb8; --violet: #9b7bff; --teal: #9b7bff; --good: #82e396; --bad: #ff6b6b; --on-accent: #23061b; --paper: #f7f3ea; --paper-ink: #17121c; --display: 'Permanent Marker', 'Marker Felt', 'Chalkboard SE', 'Comic Sans MS', sans-serif; --dweight: 400; --tape: rgba(255, 79, 184, .3); color-scheme: dark; }
/* 2010s: festival wristband. Midnight navy, coral, mint. */
body[data-era="2010"] { --bg: #111733; --panel: #1a2147; --panel2: #232c5b; --line: #313c74; --line2: #4b589c; --fg: #f3f4ff; --muted: #a1a9d8; --amber: #ff7a59; --pink: #ff7a59; --violet: #7ee0c3; --teal: #7ee0c3; --good: #7ee0c3; --bad: #ff6b7d; --on-accent: #2b0d06; --paper: #fff4ee; --paper-ink: #1a2147; --display: 'Syne', 'Arial Black', sans-serif; --dweight: 800; --tape: rgba(126, 224, 195, .35); color-scheme: dark; }

body[data-era="2020"] { --bg: #ebe7ff; --panel: #ffffff; --panel2: #f2efff; --line: #d8d1f6; --line2: #b1a6e6; --fg: #1d1636; --muted: #4a4270; --amber: #6b4bff; --pink: #ff6f9f; --violet: #ff8fb1; --teal: #1f9d8a; --good: #1d9a68; --bad: #d4335a; --on-accent: #ffffff; --paper: #ffffff; --paper-ink: #1d1636; --display: 'Unbounded', 'Arial Black', sans-serif; --dweight: 700; --tape: rgba(107, 75, 255, .22); --stage: #1d1636; --floor: #2a2150; color-scheme: light; }

/* header: the band's poster */

<script>
/* Backstage: phone-app bridge (only included in the iOS/Android build, never in the web version).
   Uses Capacitor's injected bridge, so no bundler is needed:
   - saves are mirrored to native storage (UserDefaults / SharedPreferences), which survives
     WebView cache clean-ups and is included in iCloud Backup / Google Auto Backup
   - light haptics on taps, dark status bar, splash screen
   - one-time "full game" unlock via cordova-plugin-purchase (StoreKit / Google Play Billing) */
(function () {
  const C = window.Capacitor;
  if (!C || !C.isNativePlatform || !C.isNativePlatform()) return; // web: nothing to do

  const plug = name => (C.registerPlugin ? C.registerPlugin(name) : (C.Plugins || {})[name]);
  const Prefs = plug('Preferences'), Haptics = plug('Haptics'), StatusBar = plug('StatusBar'), Splash = plug('SplashScreen');
  const PREFIX = 'backstage-';
  const UNLOCK_KEY = 'backstage-unlocked';
  const PRODUCT_ID = 'backstage_full'; // create this as a non-consumable in App Store Connect and Google Play Console

  /* ---------- 1. saves: restore from native storage, then mirror every write ---------- */
  async function restoreSaves() {
    try {
      const { keys } = await Prefs.keys();
      for (const k of keys.filter(k => k.startsWith(PREFIX))) {
        const { value } = await Prefs.get({ key: k });
        if (value != null && localStorage.getItem(k) == null) localStorage.setItem(k, value);
      }
      // first launch after an update: copy anything only the WebView has into native storage
      for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(PREFIX) && !keys.includes(k)) Prefs.set({ key: k, value: localStorage.getItem(k) }); }
    } catch (e) { console.warn('[backstage] restore failed', e); }
    if (localStorage.getItem(UNLOCK_KEY) === '1') APP.unlocked = true;
  }
  const _set = localStorage.setItem.bind(localStorage), _del = localStorage.removeItem.bind(localStorage);
  localStorage.setItem = function (k, v) { _set(k, v); if (String(k).startsWith(PREFIX)) Prefs.set({ key: String(k), value: String(v) }).catch(() => { }); };
  localStorage.removeItem = function (k) { _del(k); if (String(k).startsWith(PREFIX)) Prefs.remove({ key: String(k) }).catch(() => { }); };

  /* ---------- 2. the unlock ---------- */
  const APP = window.APP = {
    native: true, unlocked: localStorage.getItem(UNLOCK_KEY) === '1', price: '', busy: false, error: '',
    buy: () => Promise.resolve(), restore: () => Promise.resolve()
  };
  function setUnlocked() { APP.unlocked = true; localStorage.setItem(UNLOCK_KEY, '1'); }
  function initStore() {
    const CP = window.CdvPurchase; if (!CP) { console.warn('[backstage] purchase plugin missing'); return; }
    const { store, ProductType, Platform } = CP;
    const platform = C.getPlatform() === 'ios' ? Platform.APPLE_APPSTORE : Platform.GOOGLE_PLAY;
    store.register([{ id: PRODUCT_ID, type: ProductType.NON_CONSUMABLE, platform }]);
    store.when()
      .productUpdated(p => { if (p.id === PRODUCT_ID && p.pricing) APP.price = p.pricing.price; if (store.owned(PRODUCT_ID)) setUnlocked(); })
      .approved(t => t.verify())
      .verified(r => r.finish())
      .finished(t => { if (t.products.some(p => p.id === PRODUCT_ID)) setUnlocked(); });
    store.error(e => { APP.error = e && e.message ? e.message : 'The store had a problem. Try again.'; });
    store.initialize([platform]).then(() => { if (store.owned(PRODUCT_ID)) setUnlocked(); });
    const wait = ms => new Promise(r => setTimeout(r, ms));
    APP.buy = async () => {
      APP.error = ''; const p = store.get(PRODUCT_ID, platform); const offer = p && p.getOffer();
      if (!offer) { APP.error = 'The store isn’t reachable right now.'; return; }
      APP.busy = true;
      try { const err = await offer.order(); if (err && err.code !== CP.ErrorCode.PAYMENT_CANCELLED) APP.error = err.message; }
      finally { for (let i = 0; i < 20 && !APP.unlocked; i++) await wait(300); APP.busy = false; }
    };
    APP.restore = async () => { APP.error = ''; APP.busy = true; try { await store.restorePurchases(); await wait(1500); if (store.owned(PRODUCT_ID)) setUnlocked(); } finally { APP.busy = false; } };
  }
  document.addEventListener('deviceready', initStore, false);

  /* ---------- 3. feel: haptics, status bar, splash ---------- */
  let lastBuzz = 0;
  document.addEventListener('pointerdown', e => {
    const b = e.target.closest && e.target.closest('[data-a]'); if (!b || b.disabled || !Haptics) return;
    const now = Date.now(); if (now - lastBuzz < 60) return; lastBuzz = now;
    const big = ['play', 'mrun', 'pendok', 'appbuy', 'start'].includes(b.dataset.a);
    Haptics.impact({ style: big ? 'MEDIUM' : 'LIGHT' }).catch(() => { });
  }, { passive: true });
  try { StatusBar && StatusBar.setStyle({ style: 'DARK' }); } catch (e) { }

  window.APP_READY = restoreSaves().finally(() => { try { Splash && Splash.hide(); } catch (e) { } });
})();

</script>

function signOwnAct(s) {
  const L = s.ownLabel; if (!L) return { err: 'Start a label first.' };
  if (L.acts.length >= OWN_ACT_MAX) return { err: `Your label can look after ${OWN_ACT_MAX} acts.` };
  if (s.money < OWN_ACT_COST) return { err: `Signing an act costs ${money$(OWN_ACT_COST)}.` };
  s.money -= OWN_ACT_COST;
  const used = new Set(L.acts.map(a => a.name).concat(L.past || []));
  const act = { name: pick(OWN_ACT_NAMES.filter(n => !used.has(n))) || 'Nameless Youth', genre: pick(availGenres(yearOf(s))), pot: ri(1, 10), fans: ri(200, 900), since: s.week, earned: 0 };
  L.acts.push(act);
  log(s, `${L.name} signs ${act.name} (${act.genre.toLowerCase()}).`, 'money');
  return { ok: true, act };
}
function ownLabelWeek(s, r) {
  const L = s.ownLabel; if (!L) return;
  // your own records earn more without a middleman
  if (!s.label && s.fin && s.fin.stream > 0) { const b = Math.round(s.fin.stream * 0.2); s.money += b; L.bonus = (L.bonus || 0) + b; }
  L.acts.forEach(a => {
    a.fans = Math.max(50, a.fans * (1 + (a.pot - 5) * 0.004 + rnd(-0.01, 0.012)));
    const inc = Math.round(a.fans * rnd(0.22, 0.38)); a.earned += inc; s.money += inc;
  });
  const flop = L.acts.find(a => s.week - a.since > 40 && a.fans < 400);
  if (flop) { L.acts = L.acts.filter(a => a !== flop); L.past = (L.past || []).concat(flop.name); r.lines.push(`${L.name} drops ${flop.name}. Not every bet pays.`); log(s, `${L.name} drops ${flop.name}.`, 'money'); }
  const star = L.acts.find(a => a.fans > 20000 && !a.star);
  if (star) { star.star = true; s.goals.labelstar = true; r.lines.push(`${star.name}, signed to your label, are breaking big.`); log(s, `${star.name} on ${L.name} break through: ${num(star.fans)} fans.`, 'star'); }
}

/* ---------- the weekly hook ---------- */
function depthWeek(s, r, act) {
  memWeek(s);
  merchShareWeek(s);
  // stars expect better treatment on the road
  if (tierIdx(s.fans) >= 4 && (act === 'tour' || s.tour) && (s.pol.hotel || 0) < 2) {
    s.members.forEach(m => { if (!m.isArtist || s.mode === 'solo') moraleAdd(m, -2); });
    if (Math.random() < 0.5) r.lines.push('The band grumbles about cheap motels. At this level they expect proper hotels.');
  }
  // royalties promised to ex-members
  if (s.flags.royalty && s.fin && s.fin.stream > 0) { const x = Math.round(s.fin.stream * s.flags.royalty); s.money -= x; led(r, 'Royalty deal', -x); }
  ownLabelWeek(s, r);
  seasonWeek(s, r);
  fameWeek(s, r);
  if (typeof arcWeek === 'function') arcWeek(s, r);
  // platinum: a release with a million units or streams
  s.releases.forEach(rel => { if (!rel.plat && rel.streams >= 1000000) { rel.plat = true; s.goals.platinum = true; celebrate(s, 'plat', 'Platinum', `“${rel.title}” has passed a million.`); r.lines.push(`“${rel.title}” goes platinum.`); log(s, `“${rel.title}” goes platinum.`, 'star'); } });
}

/* ---------- merch share deals: less wage, a cut of the merch ---------- */
const MERCH_DEALS = [{ cut: 0, pct: 0 }, { cut: 0.25, pct: 0.03 }, { cut: 0.5, pct: 0.06 }];

function merchDeal(s, id, lvl) {
  const m = getM(s, id); if (!m || m.isArtist) return { err: 'Not possible.' };
  if (!merchDealOpen(s)) return { err: 'Merch deals open up after your first six months.' };
  const D = MERCH_DEALS[lvl]; const base = m.baseSalary || m.salary;
  if (!lvl) { m.salary = base; m.baseSalary = 0; m.mPct = 0; m.mEarn = 0; log(s, `${m.name} goes back to a full wage.`, 'money'); return { ok: true, msg: `${m.name.split(' ')[0]} is back on a full wage.` }; }
  const expect = (s.merchEma || 0) * D.pct, give = base * D.cut;

  if (expect < give * (keen ? 0.45 : 0.75)) { moraleAdd(m, -2); return { err: `${m.name.split(' ')[0]} says no: “Your merch makes about ${money$(s.merchEma || 0)} a week. ${Math.round(D.pct * 100)}% of that won’t pay my rent.”` }; }

}

}

/* ---------- dealing with a vice yourself ---------- */

/* ---------- yearly ambitions ---------- */

  album: {

  },
  money: {

    make: s => ({ p: PROJECTS.filter(p => projOpen(s, p) && !(s.projects || {})[p.id] && projCost(s, p) <= Math.max(s.money, 1) * 3).sort((a, b) => b.cost - a.cost)[0].id }),

function soldTop(s) { const best = Math.max(-1, ...VENUES.map((v, i) => s.flags['sold_' + v.id] ? i : -1)); return best; }
function ambitionChoices(s) {

}
function ambProg(s) { const a = s.amb; if (!a || !AMBITIONS[a.id]) return null; try { return AMBITIONS[a.id].prog(s, a); } catch (e) { return null; } }

/* ---------- the rival: one band you're measured against ---------- */
function nemesis(s) { return (s.rivals || []).find(r => r.id === s.nemesisId) || null; }
function pickNemesis(s, r) {
  const cur = nemesis(s), me = Math.max(100, s.fans);
  if (cur && cur.fans > me * 0.25 && cur.fans < me * 6) return;
  const cands = (s.rivals || []).filter(x => x.fans > me * 0.4 && x.fans < me * 3.5).sort((a, b) => (genreFit(b.genre, s.genre) - genreFit(a.genre, s.genre)) || (Math.abs(Math.log(a.fans / me)) - Math.abs(Math.log(b.fans / me))));
  const n = cands[0]; if (!n) return;
  s.nemesisId = n.id;

  if (r) r.lines.push(line); log(s, line, 'news');
}

  const y = yearOf(s);
  n.rel = { title: freshTitle(s), listeners: Math.round((n.fans * 0.35 + n.hype * 25) * (n.recQ / 60) * (0.6 + 0.4 * genrePop(n.genre, y)) * rnd(1, 2.5) * (n.label ? 1.5 : 1) * 2.2), week: s.week, q: n.recQ };

/* ---------- career pressure: something meaningful every few months from year two ---------- */
const PRESSURE = ['band_points', 'plagiarism_suit', 'investment', 'entourage', 'label_deadline', 'scene_shift', 'ad_offer', 'rival_press', 'solo_threat', 'festival_offer', 'burnout', 'grudge_leak', 'tax_audit'];
function pressureWeek(s) {

  if (!s.pressNext) { s.pressNext = s.week + ri(2, 8); return; }
  if (s.week < s.pressNext) return;
  const ok = PRESSURE.filter(id => EVENTS[id] && (s.cd[id] || 0) <= s.week && !(s.queue || []).some(q => q.id === id) && (() => { try { return EVENTS[id].cond(s); } catch (e) { return false; } })());
  s.pressNext = s.week + ri(9, 14);

}
function deadlineWeek(s, r) {

  if (!s.label || s.label.name !== d.label) { s.deadline = null; return; }
  const met = s.releases.some(x => x.week >= d.from && (x.kind === 'album' || (d.kind === 'record' && x.kind !== 'single')));
  if (met) { s.label.sat = clamp(s.label.sat + 15, 0, 100); r.lines.push(`${d.label} got the album on time. They’re delighted.`); log(s, `Delivered the album to ${d.label} on time.`, 'money'); s.deadline = null; }
  else if (s.week > d.by) { s.label.sat = clamp(s.label.sat - 25, 0, 100); r.lines.push(`You missed ${d.label}’s album deadline. The label is furious.`); log(s, `Missed ${d.label}’s deadline.`, 'bad'); s.deadline = null; }
}

/* ---------- the weekly hook ---------- */
function seasonWeek(s, r) {
  if (!s.amb && !s.ambAsked && s.week >= 6) { s.ambAsked = true; schedule(s, 'ambition', 0); }
  const p = ambProg(s);
  if (s.amb && !s.amb.done && s.amb.year === yearOf(s) && p && p.done && !AMBITIONS[s.amb.id].yearEnd) ambReward(s, r);
  if (s.week >= 10 && s.week % 4 === 0) pickNemesis(s, r);
  deadlineWeek(s, r);
  pressureWeek(s);
}

/* ================= FAME: what success costs, and what money is for ================= */
const eraF = s => tixF(s) / 0.9;

/* ---------- legacy projects: turn cash into a lasting name ---------- */

  { id: 'school', name: 'Fund a youth music school', cost: 80000, tier: 3, pts: 8, what: 'Instruments and lessons for kids in your home town. The press loves it, the band is proud.', fx: s => { s.pressMood = (s.pressMood || 0) + 2; s.members.forEach(m => moraleAdd(m, 5)); } },

  { id: 'fest', name: 'Launch your own festival', cost: 1200000, tier: 5, pts: 25, what: 'Your weekend, every summer. Fans and money each year, if the weather holds.', fx: s => { } }
];
const projCost = (s, p) => Math.round(p.cost * eraF(s) / 1000) * 1000;
const projOpen = (s, p) => tierIdx(s.fans) >= p.tier;
function buyProject(s, id) {
  const p = PROJECTS.find(x => x.id === id); s.projects = s.projects || {};
  if (!p || s.projects[id]) return { err: 'Already done.' };
  if (!projOpen(s, p)) return { err: 'You need to be bigger for this.' };
  const c = projCost(s, p); if (s.money < c) return { err: `You need ${money$(c)}.` };
  s.money -= c; s.projects[id] = s.week; s.legacyBonus = (s.legacyBonus || 0) + p.pts; p.fx(s);
  log(s, `${p.name}: done. (+${p.pts} legacy)`, 'star');
  celebrate(s, 'proj', p.name, `+${p.pts} legacy. ${p.what.split('.')[0]}.`);
  return { ok: true, msg: `${p.name}. +${p.pts} legacy.` };
}
const venueUpCost = s => Math.round(300000 * (s.venueLvl || 1) * eraF(s) / 1000) * 1000;
function upgradeVenue(s) {
  if (!(s.projects || {}).venue) return { err: 'Buy the venue first.' };
  if ((s.venueLvl || 1) >= 3) return { err: 'It’s already the best room in town.' };
  const c = venueUpCost(s); if (s.money < c) return { err: `You need ${money$(c)}.` };
  s.money -= c; s.venueLvl = (s.venueLvl || 1) + 1; s.legacyBonus = (s.legacyBonus || 0) + 3;
  log(s, `Your venue is rebuilt bigger (level ${s.venueLvl}).`, 'star');
  return { ok: true, msg: `Venue upgraded to level ${s.venueLvl}. +3 legacy.` };
}
function projectsWeek(s, r) {
  const P = s.projects || {};
  if (P.venue) { if (s.venueShut > 0) { s.venueShut--; s._venueW = 0; } else { const x = Math.round(1800 * eraF(s) * Math.pow(s.venueLvl || 1, 1.3) * (0.7 + Math.random() * 0.6)); s.money += x; led(r, 'Your venue', x); s._venueW = x; } }
  if (P.fest && ((s.week - 1) % 52) === 22 && P.fest < s.week - 4 && !(s.queue || []).some(q => q.id === 'fest_plan' || q.id === 'fest_result')) schedule(s, 'fest_plan', 0);
}

/* ---------- the band wants a share of the profits ---------- */
function pointsPay(s, income, r) {
  if (!s.points || s.mode !== 'band' || income <= 0 || !s.members.length) return;
  const x = Math.round(income * s.points); s.money -= x; led(r, 'Band’s share of profits', -x);
  const each = x / s.members.length; s.members.forEach(m => { m.pEarn = (m.pEarn || 0) * 0.8 + each * 0.2; });
  if (x >= 1) r.lines.push(`The band’s ${Math.round(s.points * 100)}% share of profits: ${money$(-x)}.`);
}

/* ---------- weekly ---------- */
function fameWeek(s, r) {
  projectsWeek(s, r);
  // the loan shark wants paying
  if (s.shark && s.shark.left > 0) { const pay = Math.min(s.shark.left, s.shark.pay); s.money -= pay; led(r, 'Loan repayment', -pay); s.shark.left -= pay; if (s.week % 4 === 0 || s.shark.left <= 0) r.lines.push(s.shark.left > 0 ? `Loan repayment: ${money$(-pay)}. Still owed: ${money$(s.shark.left)}.` : 'The last loan repayment. You owe nobody anything.'); if (s.shark.left <= 0) s.shark = null; }
  // great wealth attracts lawyers, accountants and hangers-on
  const free = 600000 * eraF(s);
  if (s.money > free) { const x = Math.round((s.money - free) * 0.004); s.money -= x; led(r, 'Lawyers and hangers-on', -x); s.fin = s.fin || {}; s.fin.hangers = x; if (s.week % 13 === 0) r.lines.push(`Lawyers, accountants and hangers-on: ${money$(-x)} this week. Big money has big friends.`); }
}
/* the manager's own savings */
function mgrInvest(s) {
  const g = s.mgr; if (!g || g.wallet < 100) return { err: 'You have nothing saved to put in.' };
  const x = Math.round(g.wallet * 0.25); g.wallet -= x; s.money += x;
  // it means most when the band is in trouble: money in the red, or less than a month of running costs left
  const wc = weeklyCosts(s, 'gig'), week = Math.max(50, wc.salaries + wc.pr + wc.crew + (wc.mgr || 0)), before = s.money - x;
  const hard = before < 0 || before < week * 4, recent = s.week - (g.lastInvest || -99) < 12;
  const size = clamp(x / week, 0.3, 3); // how much it helps, in weeks of costs
  let trust, mor, msg;
  if (hard) {
    trust = Math.round((5 + size * 3) * (recent ? 0.5 : 1)); mor = recent ? 2 : 5;
    s.members.forEach(m => { moraleAdd(m, mor); if (!recent && typeof remember === 'function') remember(s, m, 'favour', 'You put your own money in when things were tight'); });
    msg = `${money$(x)} of your own money goes in when the band needs it most. Trust +${trust}, morale +${mor}${recent ? '' : ', and they’ll remember it'}.`;
  } else { trust = 1; msg = `${money$(x)} of your own money goes into the band account. Things are fine right now, so it barely registers (trust +1).`; }
  g.trust = clamp(g.trust + trust, 0, 100); g.lastInvest = s.week;
  log(s, `You put ${money$(x)} of your own money into ${s.name}${hard ? ' when things were tight' : ''}.`, hard ? 'story' : 'money');
  return { ok: true, msg };
}

      { label: 'Play a fundraiser instead', hint: 'Energy, not money. +1 legacy.', fx: () => { s.foundPts = (s.foundPts || 0) + 1; s.legacyBonus = (s.legacyBonus || 0) + 1; s.members.forEach(m => { if (!m.away) m.energy = clamp(m.energy - 12, 0, 100); }); return 'A sweaty night in a small room for a good cause.'; } },
      { label: 'Not this year', hint: 'The press notices.', fx: () => { s.pressMood = (s.pressMood || 0) - 1; return 'The foundation’s newsletter is noticeably short this year.'; } }
    ]
  }
});
if (typeof PRESSURE !== 'undefined') PRESSURE.push('foundation_ask', 'venue_trouble');

/* one last lifeline before the bank freezes the account */
EVENTS.lifeline = {
  w: 0, cond: () => false,
  ctx: s => { const need = Math.round((bankLimit(s) - s.money) + 1500 * eraF(s) + (OVERHEAD[tierIdx(s.fans)] || 0) * 4); return { need: Math.max(500, Math.round(need / 100) * 100), crowd: Math.round(Math.min(s.fans * 0.9 * eraF(s), need * 1.4) / 100) * 100, wallet: s.mgr ? Math.round(s.mgr.wallet) : 0 }; },
  title: () => 'The bank’s final warning',
  text: (s, c) => `The account is frozen unless ${money$(c.need)} comes in this week. This is the last chance.`,
  choices: (s, c) => [
    { label: `Borrow from a loan shark (${money$(c.need)})`, hint: `Pay back ${money$(Math.round(c.need * 1.6))} over the next months.`, fx: () => { s.money += c.need; s.shark = { left: Math.round(c.need * 1.6), pay: Math.max(100, Math.round(c.need * 1.6 / 20)) }; s.members.forEach(m => moraleAdd(m, -4)); log(s, 'Borrowed from a loan shark to save the career.', 'bad'); return 'A man in a long coat counts the notes twice. The account is unfrozen. For now.'; } },
    ...(s.fans >= 150 ? [{ label: `Ask the fans for help (about ${money$(c.crowd)})`, hint: c.crowd >= c.need ? 'Enough, if they come through. Costs some pride.' : 'Probably not enough on its own.', fx: () => { const got = Math.round(c.crowd * rnd(0.7, 1.15)); s.money += got; s.hype = clamp(s.hype - 6, 0, 100); s.pressMood = (s.pressMood || 0) - 1; s.members.forEach(m => moraleAdd(m, 6)); log(s, `The fans raised ${money$(got)} to save ${s.name}.`, 'story'); return `${money$(got)} in small donations, with messages that make the band cry.${s.money < bankLimit(s) ? ' It isn’t enough.' : ''}`; } }] : []),
    ...(c.wallet >= c.need * 0.5 ? [{ label: `Put in your own money (${money$(Math.min(c.wallet, c.need))})`, hint: 'Your savings, their future. Trust goes up.', fx: () => { const x = Math.min(c.wallet, c.need); s.mgr.wallet -= x; s.money += x; s.mgr.trust = clamp(s.mgr.trust + 12, 0, 100); log(s, `You saved ${s.name} with your own money.`, 'story'); return 'You empty your own account into theirs. Nobody forgets that.'; } }] : []),
    { label: 'Let it end', hint: 'The account is frozen and the career is over.', fx: () => { s.over = true; log(s, 'The bank freezes the account. The career is over.', 'bad'); return 'The bank freezes the account.'; } }
  ]
};

/* ================= THE SHOW: one decision in the middle of a gig ================= */
const mFirst = m => m.name.split(' ')[0];
const frontOf = s => s.members.find(m => !m.away && (m.role === 'Vocals' || m.also === 'Vocals')) || s.members.find(m => !m.away) || s.members[0];
const bandSk = (s, k) => { const a = s.members.filter(m => !m.away); return a.length ? a.reduce((x, m) => x + m.sk[k], 0) / a.length : 5; };
const bandEn = s => { const a = s.members.filter(m => !m.away); return a.length ? a.reduce((x, m) => x + m.energy, 0) / a.length : 50; };
const bandMo = s => s.members.length ? s.members.reduce((x, m) => x + m.morale, 0) / s.members.length : 50;
const oddsWord = p => p >= 0.8 ? 'Safe' : p >= 0.62 ? 'Good odds' : p >= 0.42 ? 'Could go either way' : 'Long shot';
const O = (label, p, win, lose, extra) => ({ label, p: clamp(p, 0.08, 0.95), win, lose, ...(extra || {}) });

const MOMENTS = [
  {
    id: 'flat', w: 2, cond: () => true, title: 'The room is flat',
    text: () => 'Four songs in and nothing is happening. People are drifting to the bar.',
    opts: s => { const f = frontOf(s); return [
      O('Play your best song now', 0.9, { perf: 3, line: 'The best song, early. Heads turn back to the stage.' }, { perf: -2, line: 'Even your best song can’t wake them tonight.' }),
      O(`${mFirst(f)} talks to the crowd`, 0.2 + f.sk.stage / 22, { perf: 8, fans: 1.25, line: `${mFirst(f)} tells a story, the room laughs, and the next song explodes.` }, { perf: -5, line: `${mFirst(f)} tries a joke. Silence. Someone coughs.` }),
      O('Turn it up and attack', 0.15 + bandEn(s) / 150 + bandSk(s, 'tech') / 45, { perf: 6, fans: 1.15, energy: -6, line: 'Louder, faster, harder. The bar empties towards the stage.' }, { perf: -6, energy: -6, line: 'Louder, faster, sloppier. It turns into noise.' })
    ]; }
  },
  {

      O('Play the song he wants, badly, as a joke', 0.3 + bandSk(s, 'tech') / 40 + bandMo(s) / 300, { perf: 6, fans: 1.3, line: 'Thirty seconds of the wrong song, played for laughs. Everyone is on your side now.' }, { perf: -7, line: 'The joke cover falls apart. It just looks like you can’t play.' })
    ]; }
  },
  {
    id: 'gear', w: 1.4, cond: () => true, title: 'Something breaks',

    ]; }

  {
    id: 'newsong', w: 1.6, cond: s => s.songs.some(x => !x.rel && !x.archived), title: 'The new one?',

    opts: s => { const x = s.songs.filter(y => !y.rel && !y.archived).sort((a, b) => b.q - a.q)[0]; return [

      O('Open the encore with it', x.q / 125 + bandEn(s) / 600 - 0.05, { perf: 9, fans: 1.3, hype: 5, song: x.id, line: `The encore opens with “${x.title}”. People are asking what it’s called on the way out.` }, { perf: -7, song: x.id, line: `An unknown song as the encore. The room empties before it ends.` })

  {

    opts: s => { const f = frontOf(s); return [

    ]; }

    id: 'rowdy', w: 1.1, cond: s => s.fans > 150, title: 'Trouble at the front',

    ]; }
  },
  {
    id: 'voice', w: 2.2, cond: s => bandEn(s) < 55, title: 'Running on empty',

    opts: s => { const f = frontOf(s); return [
      O('Cut the set short', 0.9, { perf: -2, energy: 6, line: 'A short set. Nobody gets hurt.' }, { perf: -5, energy: 6, line: 'A short set, and people feel cheated.' }),
      O('Get the crowd to sing the choruses', 0.2 + f.sk.stage / 26 + Math.min(0.2, s.fans / 20000), { perf: 7, fans: 1.2, line: 'The whole room sings the hard parts. Somehow it’s the highlight.' }, { perf: -5, line: 'Nobody knows the words. Awkward.' }),
      O('Push through at full power', 0.1 + bandEn(s) / 110, { perf: 5, energy: -12, line: 'Pure will. The voice holds, just.' }, { perf: -9, energy: -15, line: 'The voice goes completely in the second to last song.' })
    ]; }
  },
  {
    id: 'power', w: 0.8, cond: () => true, title: 'Power cut',
    text: s => `Every light and amp in the building dies. Total darkness. ${yearOf(s) >= 2007 ? 'A few phone torches and lighters come on.' : 'A few lighters flick on in the crowd.'}`,
    opts: s => { const f = frontOf(s); return [
      O('Wait for the power', 0.75, { perf: -1, line: 'Ten minutes later the lights are back and the show goes on.' }, { perf: -6, line: 'The power never comes back. Refund arguments at the door.' }),
      O('Play acoustic in the dark', 0.15 + bandSk(s, 'tech') / 32 + (f.voice || 8) / 45, { perf: 10, fans: 1.4, hype: 6, line: 'Unplugged, in the dark, everyone singing. The kind of night that becomes a legend.' }, { perf: -5, line: 'Nobody past the third row can hear a thing.' }),
      O('Drum solo', 0.3 + bandSk(s, 'stage') / 40, { perf: 5, fans: 1.1, line: 'Drums need no electricity. The room claps along until the lights return.' }, { perf: -4, line: 'Four minutes of drums in the dark is three too many.' })
    ]; }
  },
  {
    id: 'bigroom', w: 5, cond: (s, v) => !(s.played && s.played[v.id]) && v.id !== 'pub', title: 'A bigger room',
    text: (s, v) => `First time at ${v.name}. From the wings the room looks enormous. The band has gone quiet.`,
    opts: s => [
      O('Play the set exactly as rehearsed', 0.55 + bandSk(s, 'disc') / 50, { perf: 3, line: 'By the book. The nerves settle after two songs.' }, { perf: -4, line: 'Stiff and careful. The room feels too big for them.' }),
      O('Give them a speech', 0.25 + (s.mgr ? s.mgr.trust : 50) / 150, { perf: 7, morale: 5, line: 'You say the right thing in the corridor. They walk on ten feet tall.' }, { perf: -3, morale: -3, line: 'Your speech makes it worse. Now everyone is thinking about it.' }),
      O('Open with the loudest song you have', 0.2 + bandEn(s) / 160 + bandSk(s, 'stage') / 50, { perf: 8, fans: 1.2, hype: 4, energy: -5, line: 'They walk on and hit the room in the face. It never recovers.' }, { perf: -7, energy: -5, line: 'Too fast, too soon. The opener is a mess.' })
    ]

/* the first option is the safe one; the others are real gambles */
// bold moves (a big upside) are harder when the band is tired or unhappy, and in a room they have never played
const momentNerves = (s, v) => 0.62 + 0.12 * bandMo(s) / 100 + 0.12 * bandEn(s) / 100;
const momentNewRoom = (s, v) => !(s.played && s.played[v.id]);
function momentOpts(M, s, v) { const k = momentNerves(s, v), pen = momentNewRoom(s, v) ? 0.07 : 0.04; return M.opts(s, v).map(o => o.win.perf >= 4 ? { ...o, p: clamp(o.p * k - pen, 0.08, 0.88) } : o); }
/* pick a moment for this show (or null) */
function gigMoment(s, venueId) {
  const v = VENUES.find(x => x.id === venueId) || VENUES[0];
  const pool = MOMENTS.filter(m => { try { return m.cond(s, v) && m.id !== s._lastMoment; } catch (e) { return false; } });
  if (!pool.length) return null;
  const tot = pool.reduce((a, m) => a + m.w, 0); let x = Math.random() * tot, m = pool[0];
  for (const p of pool) { x -= p.w; if (x <= 0) { m = p; break; } }
  return { id: m.id, venue: v.id, title: m.title, text: m.text(s, v), opts: momentOpts(m, s, v).map(o => ({ label: o.label, odds: oddsWord(o.p), big: Math.abs(o.win.perf) >= 8 })) };
}
/* should this show stop for a moment? always in a new room, otherwise a bit more than half the time */
function wantMoment(s, venueId) {
  const v = VENUES.find(x => x.id === venueId) || VENUES[0];
  if (s.week < 2 && !(s.stats && s.stats.gigs)) return false;
  return (!(s.played && s.played[v.id]) && v.id !== 'pub') || Math.random() < 0.6;
}
function momentResolve(s, mom, r) {
  const M = MOMENTS.find(m => m.id === mom.id); const v = VENUES.find(x => x.id === mom.venue) || VENUES[0];
  if (!M) return null;
  let o; try { o = momentOpts(M, s, v)[mom.pick]; } catch (e) { return null; }
  if (!o) return null;
  const won = Math.random() < o.p, res = won ? o.win : o.lose;
  s._lastMoment = M.id;
  if (res.energy) s.members.forEach(m => { if (!m.away) m.energy = clamp(m.energy + res.energy, 0, 100); });
  if (res.morale) s.members.forEach(m => moraleAdd(m, res.morale));
  if (res.hype) s.hype = clamp(s.hype + res.hype, 0, 100);
  if (res.song) { const x = s.songs.find(y => y.id === res.song); if (x) x.love = Math.round(clamp((x.love || 0) + (won ? 12 : -4), 0, 100)); }
  s.stats.moments = (s.stats.moments || 0) + 1; if (won) s.stats.momentsWon = (s.stats.momentsWon || 0) + 1;
  r.moment = { title: M.title, label: o.label, won, line: res.line, perf: res.perf || 0 };
  return { perf: res.perf || 0, fans: res.fans || 1, won };
}

/* ================= ARC: a career with a rise, a peak, a decline and an ending ================= */
const careerYear = s => Math.floor((s.week - 1) / 52) + 1;
const evN = (s, id) => (s.evSeen && s.evSeen[id]) || 0;
function careerPhase(s) {
  if (s.farewell) return 'Farewell';
  if (s.heritage) return 'Heritage act';
  if (s.flags.comeback && (s.rel || 1) >= 0.95 && s.week - s.flags.comeback < 156) return 'Comeback';
  if ((s.rel || 1) < 0.9) return 'Past the peak';
  const y = careerYear(s);
  return y <= 2 ? 'Starting out' : y <= 5 ? 'On the rise' : 'At the peak';
}

/* ---------- what each new level opens up ---------- */
const UNLOCKS = [
  '',
  'Clubs will book you now. Bigger bands may ask you to open for them.',
  'You can tour the country. Labels start to listen.',
  'TV wants you. Europe opens up. Legacy projects are possible, and the band will want its share.',
  'Award nominations, festivals, arenas, and tours of the UK and America.',
  'Stadiums. A world tour. Your own festival.',
  'There is nowhere higher. The Hall of Fame is watching.'
];
function tierCheck(s) {
  const t = tierIdx(s.fans);
  if (s.tierTop == null) { s.tierTop = t; return; }
  if (t > s.tierTop) {
    s.tierTop = t;
    celebrate(s, 'tier', TIERS[t][1], UNLOCKS[t] || '');
  }
}

/* ---------- farewell ---------- */
const farewellOpen = s => !s.farewell && !s.over && s.week > 104;
function announceFarewell(s) {
  if (!farewellOpen(s)) return { err: 'Too early for a farewell. Give it at least two years.' };
  s.farewell = { week: s.week }; s.hype = clamp(s.hype + 25, 0, 100);
  log(s, `${s.name} announce${s.mode === 'band' ? '' : 's'} a farewell. Ten more weeks, then one last show.`, 'story');
  schedule(s, 'final_show', 10);
  return { ok: true, msg: 'The farewell is announced. Ten weeks of full houses, then the last show.' };
}

/* ---------- yearly and weekly ---------- */
function arcYear(s, r) {
  const y = careerYear(s);
  if (y >= 7 && !s.heritage) {
    const before = s.rel || 1;
    s.rel = Math.max(0.55, before - (s.hard ? 0.05 : 0.035));
    if (before >= 0.9 && s.rel < 0.9) { log(s, 'The spotlight is moving on. Younger bands are on the covers now.', 'story'); schedule(s, 'past_peak', ri(3, 9)); }
    else if (s.rel < 0.85 && !(s.queue || []).some(q => q.id === 'past_peak') && y % 2 === 0) schedule(s, 'past_peak', ri(6, 20));
  }
  s.members.forEach(m => { if (m.age >= 42 && !m.away) { m.sk.stage = Math.max(3, +(m.sk.stage - 0.25).toFixed(1)); } });
  if (y === 10 && !s.farewell && !s.flags.fareIdea) { s.flags.fareIdea = s.week; schedule(s, 'farewell_idea', ri(8, 30)); }
}
function arcWeek(s, r) {
  tierCheck(s);
  if (s.heritage && s.hype > 60) s.hype = Math.max(60, s.hype - 2);
  if (((s.week - 1) % 52) === 45 && tierIdx(s.fans) >= 3 && !(s.queue || []).some(q => q.id === 'awards')) {
    const rels = s.releases.filter(x => s.ys && x.week >= s.ys.week0);
    if (rels.some(x => (x.reviewAvg || 0) >= 6.5 || (x.bestPos || 99) <= 20) || liveRep(s) > 1.12) schedule(s, 'awards', 1);
  }
}

/* ---------- repeated events: rarer, and different each time ---------- */
const EV_CD = { scene_shift: 150, ad_offer: 90, entourage: 80, benefit: 60, viral: 40, demo: 40, paytalk: 40, plagiarism_suit: 100, investment: 80, tv_show: 50, support_offer: 26, rival_press: 40, tribute: 200, biography: 400, anniversary: 120, young_cover: 120, greatest_hits: 300, reunion: 150, slow_down: 100, band_points: 60 };
function againText(id, lines) {
  const E = EVENTS[id]; if (!E) return; const t0 = E.text;
  E.text = (s, c, m) => { const n = evN(s, id); const base = t0(s, c, m); return n >= 2 ? `${lines[Math.min(lines.length - 1, n - 2)]} ${base}` : base; };
}
function addCond(id, f) { const E = EVENTS[id]; if (!E) return; const c0 = E.cond; E.cond = s => f(s) && c0(s); }

function stageEvents() {
  ['scene_shift', 'ad_offer', 'plagiarism_suit', 'investment', 'entourage'].forEach(id => addCond(id, s => s.week >= 60));
  againText('viral', ['It happens again.', 'By now you know how this goes.', 'Another one.']);
  againText('benefit', ['They remember you helped last time.', 'You’re the first call for these now.']);
  againText('demo', ['Another late-night idea.', 'The 3 a.m. demos are becoming a tradition.']);
  againText('entourage', ['The demands are growing.', 'This time there’s a list, typed.']);
  againText('ad_offer', ['Another brand, a bigger cheque.', 'The advertisers keep coming.']);
  againText('scene_shift', ['Fashion turns again.', 'You’ve seen this film before.']);
  // poaching: every new approach is bigger
  if (EVENTS.poach) { const E = EVENTS.poach, c0 = E.ctx, t0 = E.text; E.ctx = s => { const c = c0(s); const m = getM(s, c.m); c.offer = Math.round(Math.min(c.offer * (1 + 0.2 * Math.min(2, Math.max(0, evN(s, 'poach') - 1))), Math.max(c.offer, m ? fairSalary(m, s.fans) * 2.2 : c.offer))); return c; }; E.text = (s, c, m) => { const n = evN(s, 'poach'); return (n >= 3 ? 'Every bigger band seems to want your players now. ' : n === 2 ? 'It’s the second time someone has come for one of yours. ' : '') + t0(s, c, m); }; }
  // pay talk: if you said "free", they don't ask again for a year
